<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>일일업무일지 - 어썸조경</title>

<!-- PWA: 홈화면 앱(아이콘) 설정 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5631">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일일업무일지">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard','Malgun Gothic','맑은 고딕',sans-serif; background:#f0f4f1; min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }

  header { background:linear-gradient(135deg,#1e5631 0%,#2e7d46 60%,#3f9d5a 100%); border-radius:16px; padding:28px 32px; color:#fff; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 14px rgba(30,86,49,.25); }
  .brand { display:flex; align-items:center; gap:16px; }
  .logo { width:58px; height:58px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .brand h1 { font-size:32px; font-weight:800; letter-spacing:8px; text-indent:8px; line-height:1.1; text-shadow:0 2px 5px rgba(0,0,0,.18); }
  .brand .sub { font-size:12px; opacity:.8; margin-top:7px; letter-spacing:3px; font-weight:500; padding-top:7px; border-top:1px solid rgba(255,255,255,.3); display:inline-block; }
  .header-date { text-align:right; }
  .header-date .today { font-size:20px; font-weight:bold; }
  .header-date .weekday { font-size:14px; opacity:.85; margin-top:2px; }

  .menu { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:22px; }
  .menu button { border:none; border-radius:14px; padding:22px 10px 18px; cursor:pointer; background:#fff; transition:all .15s; border-bottom:5px solid transparent; text-align:center; }
  .menu button:hover { transform:translateY(-3px); }
  .menu .icon { font-size:32px; display:block; }
  .menu .icon svg { width:36px; height:36px; vertical-align:middle; }
  h2 svg { width:24px; height:24px; vertical-align:-4px; }
  .menu .name { font-size:19px; font-weight:bold; margin-top:8px; display:block; color:#333; }
  .menu button.c1 { border-bottom-color:#2f80c4; box-shadow:0 0 0 2px #2f80c4 inset, 0 2px 8px rgba(0,0,0,.07); }
  .menu button.c2 { border-bottom-color:#27a36a; box-shadow:0 0 0 2px #27a36a inset, 0 2px 8px rgba(0,0,0,.07); }
  .menu button.c3 { border-bottom-color:#e8842c; box-shadow:0 0 0 2px #e8842c inset, 0 2px 8px rgba(0,0,0,.07); }
  .menu button.c4 { border-bottom-color:#8a8f98; box-shadow:0 0 0 2px #8a8f98 inset, 0 2px 8px rgba(0,0,0,.07); }
  .menu button.active { transform:translateY(-2px); }
  .menu button.active.c1 { box-shadow:0 0 0 3px #2f80c4 inset, 0 6px 16px rgba(0,0,0,.16); }
  .menu button.active.c2 { box-shadow:0 0 0 3px #27a36a inset, 0 6px 16px rgba(0,0,0,.16); }
  .menu button.active.c3 { box-shadow:0 0 0 3px #e8842c inset, 0 6px 16px rgba(0,0,0,.16); }
  .menu button.active.c4 { box-shadow:0 0 0 3px #8a8f98 inset, 0 6px 16px rgba(0,0,0,.16); }

  .panel { background:#fff; border-radius:14px; margin-top:18px; padding:30px; min-height:340px; box-shadow:0 2px 8px rgba(0,0,0,.07); display:none; }
  .panel.show { display:block; }
  #inspect{--c:#2f80c4;} #disinfect{--c:#27a36a;} #construct{--c:#e8842c;} #etc{--c:#8a8f98;}
  .panel h2 { font-size:21px; padding-bottom:12px; border-bottom:2px solid #eee; margin-bottom:18px; display:flex; align-items:center; gap:10px; }
  .badge { font-size:12px; color:#fff; padding:3px 10px; border-radius:20px; }

  .region-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; }
  .region-grid button { border:1.5px solid color-mix(in srgb,var(--c) 28%,#fff); background:color-mix(in srgb,var(--c) 6%,#fff); border-radius:12px; padding:16px 8px; cursor:pointer; transition:all .15s; text-align:center; }
  .region-grid button:hover { background:var(--c); border-color:var(--c); transform:translateY(-2px); box-shadow:0 5px 12px rgba(0,0,0,.15); }
  .region-grid button:hover .rg-name, .region-grid button:hover .rg-cnt { color:#fff; }
  .region-grid .rg-name { display:block; font-size:17px; font-weight:bold; color:#333; }
  .region-grid .rg-cnt { display:block; font-size:12px; color:#7a93a6; margin-top:5px; }
  .site-search { width:100%; border:1.5px solid #cfdcd3; border-radius:10px; padding:11px 14px; font-size:15px; margin-bottom:12px; font-family:inherit; }
  .site-search:focus { outline:none; border-color:#3f9d5a; }
  .search-results { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .search-results:empty { display:none; }
  .sr-region { display:block; font-size:11px; color:#8898a4; margin-top:3px; }
  .wb-date-lb { margin-left:10px; }

  .back-btn { border:none; background:#eef4f0; color:#1e5631; font-size:14px; font-weight:bold; padding:8px 16px; border-radius:20px; cursor:pointer; margin-bottom:16px; }
  .back-btn:hover { background:#dceadf; }
  .school-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .school-row { border:1px solid color-mix(in srgb,var(--c) 22%,#fff); border-radius:10px; padding:14px 8px; background:color-mix(in srgb,var(--c) 4%,#fff); cursor:pointer; transition:all .12s; text-align:center; }
  .school-row:hover { background:color-mix(in srgb,var(--c) 12%,#fff); border-color:color-mix(in srgb,var(--c) 45%,#fff); }
  .school-row.selected { background:#f6faf7; border-color:var(--c); box-shadow:inset 4px 0 0 var(--c); }
  .sub-sep { grid-column:1/-1; font-size:12px; font-weight:bold; padding:6px 2px 2px; border-top:1px dashed; margin-top:4px; }
  .work-note { background:#fff7ef; border:1px dashed #e8b58a; color:#a96a2c; font-size:13px; padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  .work-list { display:flex; flex-direction:column; gap:10px; }
  .work-item { display:flex; align-items:center; gap:10px; border:1px solid #eadfd5; background:#fffdfb; border-radius:10px; padding:13px 16px; cursor:pointer; }
  .work-item:hover { background:#fdf4ea; }
  .work-name { font-size:15px; font-weight:bold; color:#333; flex:1; }
  .work-stage { color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:20px; }
  .work-stage.off { background:#dcd3c8; }
  .stage-row { display:flex; flex-wrap:wrap; gap:8px; padding:4px 2px 10px; }
  .stage-btn { border:1.5px solid #e0d4c8; background:#fff; color:#7a6a5a; font-size:13px; padding:8px 14px; border-radius:20px; cursor:pointer; transition:all .12s; }
  .stage-btn:hover { border-color:var(--c); color:var(--c); }
  .stage-btn.on { background:var(--c); border-color:var(--c); color:#fff; }
  .stage-pill { color:#fff; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .work-date { font-size:11px; color:#b0a18f; margin-right:2px; }
  .work-recv { font-size:12px; color:#9a5a16; background:#fff7ef; border:1px dashed #e8b58a; border-radius:8px; padding:6px 10px; margin:2px 2px 8px; }
  .recv-box { padding:2px 2px 10px; }
  .recv-box label { display:block; font-size:13px; color:#9a5a16; font-weight:bold; margin-bottom:6px; }
  .recv-box label small { color:#bb9; font-weight:normal; }
  .recv-input { width:100%; min-height:54px; border:1.5px solid #e0d4c8; border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; resize:vertical; }
  .recv-input:focus { outline:none; border-color:#e8842c; }
  .est-form { display:flex; gap:8px; margin-bottom:14px; }
  .visit-form { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .visit-form input { flex:1; min-width:150px; }
  .visit-form input[type=datetime-local] { flex:0 0 auto; }
  .est-purpose { flex:1; color:#555; font-size:14px; }
  .remark-cats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .remark-cat { border:1.5px solid var(--rc); background:#fff; color:var(--rc); font-size:15px; font-weight:bold; padding:12px 22px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .remark-cat:hover { background:var(--rc); color:#fff; }
  .region-grid button.region-special { border-style:dashed; background:#f7f9fb; }
  .est-input { flex:1; border:1.5px solid #d9d3cb; border-radius:10px; padding:11px 14px; font-size:14px; }
  .est-add { border:none; background:#8a8f98; color:#fff; font-weight:bold; padding:0 20px; border-radius:10px; cursor:pointer; }
  .est-add:hover { background:#727882; }
  .est-list { display:flex; flex-direction:column; gap:8px; }
  .est-item { display:flex; align-items:center; gap:10px; border:1px solid #e6e3df; border-radius:10px; padding:12px 16px; background:#fafafa; }
  .est-name { flex:1; font-weight:bold; color:#333; }
  .est-date { font-size:12px; color:#999; }
  .est-del { cursor:pointer; color:#bbb; font-weight:bold; font-style:normal; font-size:16px; }
  .est-del:hover { color:#d33; }
  .doc-count { background:#8a8f98; color:#fff; font-size:11px; border-radius:20px; padding:1px 7px; margin-left:6px; }
  .school-row.selected .sr-name::after { content:' \2713'; color:var(--c); font-weight:bold; }
  .sr-no { color:#aab8c2; font-size:13px; text-align:center; }
  .sr-name { font-size:15px; font-weight:bold; color:#222; }
  .sr-sub { font-size:12px; color:#8898a4; margin-top:2px; }
  .sr-dist { font-size:13px; color:#2f80c4; font-weight:bold; white-space:nowrap; }
  .sr-dist small { color:#aab8c2; font-weight:normal; }

  .summary { background:#fff; border-radius:14px; margin-top:18px; padding:20px 24px; box-shadow:0 2px 8px rgba(0,0,0,.07); }
  /* 작성자 바 + 전송 */
  .writerbar { display:flex; align-items:center; gap:12px; margin-top:16px; background:#fff; border-radius:12px; padding:14px 18px; box-shadow:0 2px 8px rgba(0,0,0,.06); flex-wrap:wrap; }
  .writerbar label { font-weight:bold; color:#1e5631; font-size:15px; }
  .writerbar select { font-size:15px; padding:8px 12px; border:1.5px solid #cfdcd3; border-radius:10px; background:#f7fbf8; font-family:inherit; }
  .wb-hint { font-size:13px; color:#9aa59d; }
  .sum-btns { display:flex; gap:8px; align-items:center; }
  .sent-status { font-size:12px; color:#6b8f7d; white-space:nowrap; margin-right:4px; }
  #sendBtn { border:none; background:#1e5631; color:#fff; font-weight:bold; border-radius:8px; padding:7px 18px; cursor:pointer; font-size:13px; }
  #sendBtn:hover { background:#16482a; }
  #sendBtn:disabled { background:#9bb0a3; cursor:default; }
  .summary-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .summary-head h3 { font-size:17px; color:#1e5631; }
  .cnt-wrap { display:inline-flex; gap:6px; margin-left:8px; vertical-align:middle; }
  .cnt-chip { color:#fff; border-radius:20px; padding:3px 12px; font-size:13px; font-weight:bold; }
  .cnt-zero { background:#cdd6cf; color:#fff; border-radius:20px; padding:3px 12px; font-size:13px; }
  #clearSummary { border:none; background:#f3f3f3; color:#888; border-radius:8px; padding:7px 13px; cursor:pointer; font-size:12px; }
  #clearSummary:hover { background:#ffe6e6; color:#d33; }
  .sum-empty { color:#aaa; text-align:center; padding:18px 0; font-size:14px; }
  .sum-cat { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:11px 0; border-bottom:1px dashed #eee; }
  .sum-cat:last-child { border-bottom:none; }
  .sum-tag { color:#fff; font-size:12px; font-weight:bold; padding:4px 11px; border-radius:6px; white-space:nowrap; }
  .sum-item { background:#f5f8fa; border-radius:8px; padding:5px 10px; font-size:13px; color:#333; display:inline-flex; align-items:center; gap:6px; }
  .sum-item b { color:#666; font-weight:600; }
  .sum-item i { cursor:pointer; color:#bbb; font-style:normal; font-weight:bold; font-size:15px; }
  .sum-item i:hover { color:#d33; }
  footer { text-align:center; color:#9aa59d; font-size:12px; margin-top:26px; }

  /* ── ④단계: 보기 대시보드 ── */
  .view-btns { display:flex; gap:8px; margin:0 14px; }
  .view-btns button { border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.13); color:#fff; border-radius:9px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:bold; font-family:inherit; }
  .view-btns button:hover { background:rgba(255,255,255,.28); }
  #viewOverlay { position:fixed; inset:0; background:rgba(20,40,28,.45); z-index:50; display:none; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; }
  .vo-card { background:#fff; border-radius:16px; max-width:760px; width:100%; padding:20px 22px 26px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .vo-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .vo-tabs { display:flex; gap:6px; }
  .vo-tabs button { border:1.5px solid #cfdcd3; background:#f7fbf8; color:#456; border-radius:9px; padding:7px 14px; cursor:pointer; font-size:13px; font-weight:bold; font-family:inherit; }
  .vo-tabs button.on { background:#1e5631; border-color:#1e5631; color:#fff; }
  #voDate { font-size:14px; padding:6px 10px; border:1.5px solid #cfdcd3; border-radius:9px; background:#f7fbf8; font-family:inherit; }
  #voClose { margin-left:auto; border:none; background:#f3f3f3; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:14px; color:#777; }
  #voClose:hover { background:#ffe6e6; color:#d33; }
  .vo-writer { border:1px solid #e6ece8; border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .vo-writer h4 { color:#1e5631; font-size:15px; margin-bottom:4px; }
  .vo-sent { font-size:12px; color:#6b8f7d; margin-bottom:8px; }
  .vo-warn { color:#b8860b; }
  .vo-cat { display:flex; gap:8px; padding:8px 0; border-bottom:1px dashed #eee; align-items:flex-start; }
  .vo-cat:last-child { border-bottom:none; }
  .vo-items { display:flex; flex-direction:column; gap:5px; flex:1; }
  .vo-item { font-size:13px; color:#333; background:#f5f8fa; border-radius:8px; padding:5px 9px; }
  .vo-place { color:#667; }
  .vo-extra { color:#888; font-size:12px; }
  .vo-empty { color:#aaa; text-align:center; padding:16px 0; font-size:14px; }
  .vo-none { font-size:12px; color:#999; margin-top:4px; }

  /* ── 휴대폰 화면 최적화 ── */
  @media (max-width:600px){
    .wrap { padding:14px 12px 40px; }
    header { flex-direction:column; align-items:flex-start; gap:12px; padding:18px 18px; border-radius:14px; }
    .brand { gap:12px; }
    .logo { width:46px; height:46px; font-size:24px; }
    .brand h1 { font-size:24px; letter-spacing:4px; }
    .header-date { text-align:left; align-self:flex-end; }
    .header-date .today { font-size:17px; }
    .menu { gap:8px; margin-top:16px; }
    .menu button { padding:14px 6px 12px; border-radius:12px; }
    .menu .icon { font-size:26px; }
    .menu .icon svg, .menu button .icon svg { width:28px; height:28px; }
    .menu .name { font-size:15px; margin-top:5px; }
    .panel { padding:18px 16px; border-radius:12px; min-height:260px; }
    .panel h2 { font-size:18px; flex-wrap:wrap; }
    .region-grid { grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
    .region-grid button { padding:12px 6px; }
    .region-grid .rg-name { font-size:15px; }
    .school-list { grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; }
    .school-row { padding:11px 6px; }
    .sr-name { font-size:14px; }
    .writerbar { padding:12px 14px; gap:8px; }
    .writerbar .wb-hint { width:100%; font-size:12px; }
    .summary { padding:16px 16px; }
    .summary-head { flex-wrap:wrap; gap:8px; }
    .sum-btns { width:100%; flex-wrap:wrap; }
    .sent-status { width:100%; margin:0 0 4px; }
    .est-form, .visit-form { flex-wrap:wrap; }
    .est-input, .visit-form input { min-width:0; width:100%; }
    .est-add { width:100%; padding:11px 0; }
    .remark-cat { flex:1 1 40%; justify-content:center; }
    .stage-btn { font-size:12px; padding:7px 10px; }
    .view-btns { margin:0; width:100%; }
    .view-btns button { flex:1; padding:9px 6px; }
    #viewOverlay { padding:14px 8px; }
    .vo-card { padding:16px 14px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">🌿</div>
      <div>
        <h1>일일업무일지</h1>
        <div class="sub">(주)어썸조경 · AWESOME LANDSCAPE</div>
      </div>
    </div>
    <div class="view-btns">
      <button id="btnViewMine" type="button">📖 내 일지</button>
      <button id="btnViewAll" type="button">👥 전체 일지</button>
      <button id="btnMap" type="button">🗺️ 현황지도</button>
      <button id="btnWeekly" type="button" style="display:none">📊 주간보고</button>
      <button id="btnAdminEdit" type="button" style="display:none">🔑 마스터 수정</button>
    </div>
    <div class="header-date">
      <div class="today" id="today"></div>
      <div class="weekday" id="weekday"></div>
    </div>
  </header>

  <div class="writerbar">
    <label>작성자</label>
    <select id="writerSel"></select>
    <label class="wb-date-lb">작업 날짜</label>
    <input type="date" id="workDate">
    <span class="wb-hint">내용은 이 기기에 자동 저장돼요 · 다 쓰면 「전송」</span>
  </div>

  <nav class="menu">
    <button class="c1" data-tab="inspect"><span class="icon">🔍</span><span class="name">점검</span></button>
    <button class="c2" data-tab="disinfect"><span class="icon">💨</span><span class="name">소독</span></button>
    <button class="c3" data-tab="construct"><span class="icon"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-45 32 32)"><rect x="24" y="2" width="16" height="6" rx="3" fill="#8d6e63"/><rect x="29.5" y="6" width="5" height="27" rx="2" fill="#8d6e63"/><path d="M23 32 h18 v8 c0 9 -9 14 -9 14 s-9 -5 -9 -14 z" fill="#78909c"/></g><g transform="rotate(45 32 32)"><rect x="29.5" y="16" width="5" height="40" rx="2" fill="#a1887f"/><rect x="19" y="6" width="26" height="12" rx="4" fill="#546e7a"/></g></svg></span><span class="name">공사</span></button>
    <button class="c4" data-tab="etc"><span class="icon">📋</span><span class="name">사무</span></button>
  </nav>

  <!-- 4개 패널 내용은 아래 스크립트(setupCategory/Construction/Etc)가 채웁니다 -->
  <section class="panel" id="inspect"></section>
  <section class="panel" id="disinfect"></section>
  <section class="panel" id="construct"></section>
  <section class="panel" id="etc"></section>

  <section class="summary">
    <div class="summary-head">
      <h3>📝 오늘의 업무 <span id="summaryCount" class="cnt-wrap"></span></h3>
      <div class="sum-btns"><span id="sentStatus" class="sent-status"></span><button id="consolidateBtn" style="display:none;border:none;background:#b8860b;color:#fff;font-weight:bold;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px">취합</button><button id="sendBtn">전송</button><button id="clearSummary">전체 지우기</button></div>
    </div>
    <div id="summaryBody"></div>
  </section>

  <footer>어썸조경 전체 업무 관리 시스템 · 일일업무일지</footer>
</div>

<!-- ④단계: 보기 대시보드 -->
<div id="viewOverlay">
  <div class="vo-card">
    <div class="vo-head">
      <div class="vo-tabs">
        <button id="voTabMine" type="button">내 일지</button>
        <button id="voTabAll" type="button">전체 일지</button>
      </div>
      <input type="date" id="voDate">
      <button id="voClose" type="button">✕ 닫기</button>
    </div>
    <div id="voBody"></div>
  </div>
</div>

<script src="학교DB.js"></script>
<script>
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  // 작업 날짜(기본 오늘). 날짜를 바꾸면 그 날짜로 작성·저장·전송됩니다.
  let cur = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  function pad2(x){ return String(x).padStart(2,'0'); }
  function dateKey(){ return 'ilji_'+cur.getFullYear()+'-'+(cur.getMonth()+1)+'-'+cur.getDate(); }
  function dateStr(){ return cur.getFullYear()+'-'+pad2(cur.getMonth()+1)+'-'+pad2(cur.getDate()); }
  function todayStrFixed(){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function statStoreKey(){ return 'gongsa_status_'+dateKey(); }
  function renderHeaderDate(){
    document.getElementById('today').textContent = cur.getFullYear()+'년 '+(cur.getMonth()+1)+'월 '+cur.getDate()+'일';
    document.getElementById('weekday').textContent = days[cur.getDay()]+'요일'+(dateStr()!==todayStrFixed()?' · 지난 날짜 작성중':'');
  }
  renderHeaderDate();

  const buttons = document.querySelectorAll('.menu button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
      btn.classList.add('active');
      const p = document.getElementById(btn.dataset.tab);
      p.classList.add('show');
      if(p._home) p._home();   // 탭 누르면 항상 지역 선택 화면부터 시작
    });
  });

  const SCHOOLS = window.SCHOOLS;  // 데이터는 학교DB.js 에서 로드;
  const SUBGROUP={
    '소독':{label:'단타', color:'#12a594', items:['단타초','단타유','단타어린이집','단타기관']}
  };
  // 공사·사무 지역 선택에 추가되는 '기타지역'(학교가 아닌 현장)
  const ETC_REGION={label:'기타지역', items:['기타초','기타중','기타고','기타유','기타어린이집','기타기관']};

  // 오늘의 업무 저장소 (다중 선택 · 분류별)
  const CAT_COLORS={'점검':'#2f80c4','소독':'#27a36a','공사':'#e8842c','사무':'#8a8f98'};
  let SEL={};
  try{ SEL=JSON.parse(localStorage.getItem(dateKey()))||{}; }catch(e){ SEL={}; }
  function saveSel(){ try{ localStorage.setItem(dateKey(),JSON.stringify(SEL)); }catch(e){} }
  function isSel(cat,key){ return !!(SEL[cat]&&SEL[cat][key]); }
  function toggleSel(cat,key,info){
    SEL[cat]=SEL[cat]||{};
    if(SEL[cat][key]) delete SEL[cat][key];
    else SEL[cat][key]=info;
    if(Object.keys(SEL[cat]).length===0) delete SEL[cat];
    saveSel(); renderSummary();
  }

  function renderRegionsInto(grid, extra){
    const order=['천안','아산','청주','논산','공주','서산','예산','부여','홍성','안성','평택','보령','태안','금산','청양','당진','세종','서천','계룡','진천','내포신도시','증평','괴산','충주','이천'];
    const cnt={};
    SCHOOLS.forEach(s=>cnt[s.지역]=(cnt[s.지역]||0)+1);
    let html=order.filter(r=>cnt[r]).map(r=>
      '<button data-region="'+r+'"><span class="rg-name">'+r+'</span><span class="rg-cnt">'+cnt[r]+'개교</span></button>'
    ).join('');
    if(extra){ html+='<button data-region="'+extra.label+'"><span class="rg-name">'+extra.label+'</span><span class="rg-cnt">'+extra.items.length+'개</span></button>'; }
    grid.innerHTML=html;
  }
  // 현장 검색 (지역 선택 화면 위 검색창)
  function searchBarHTML(){ return '<input class="site-search" type="text" placeholder="🔍 현장 이름으로 검색 (예: 가온초)" autocomplete="off"><div class="search-results"></div>'; }
  function matchSchools(q){ q=(q||'').trim(); if(!q) return []; return SCHOOLS.filter(s=>s.학교명.indexOf(q)>=0).slice(0,80); }
  function searchRowsHTML(list, mode, cat){
    if(!list.length) return '<div class="sum-empty">검색 결과 없음</div>';
    return list.map(s=>{
      const reg='<span class="sr-region">'+s.지역+'</span>';
      if(mode==='select') return '<div class="school-row'+(isSel(cat,s.학교명)?' selected':'')+'" data-key="'+s.학교명+'" data-name="'+s.학교명+'" data-region="'+s.지역+'" data-sub=""><span class="sr-name">'+s.학교명+'</span>'+reg+'</div>';
      return '<div class="school-row" data-school="'+s.학교명+'" data-sregion="'+s.지역+'"><span class="sr-name">'+s.학교명+'</span>'+reg+'</div>';
    }).join('');
  }
  function wireSearch(panel, mode, cat){
    panel.addEventListener('input',e=>{
      if(!e.target.closest('.site-search')) return;
      const grid=panel.querySelector('.region-grid'), res=panel.querySelector('.search-results');
      if(!res) return;
      const q=e.target.value.trim();
      if(!q){ res.innerHTML=''; if(grid) grid.style.display=''; return; }
      if(grid) grid.style.display='none';
      res.innerHTML=searchRowsHTML(matchSchools(q), mode, cat);
    });
  }

  // 분류별(점검·소독·공사) 지역→학교 화면을 동일 방식으로 구성
  function setupCategory(panelId, cat, color, icon){
    const panel=document.getElementById(panelId);
    const extra=null;  // 점검·소독은 '기타지역' 없음 (공사·사무만 ETC_REGION 사용)
    function showRegions(){
      panel.innerHTML='<h2>'+icon+' '+cat+' <span class="badge" style="background:'+color+'">지역 선택</span></h2>'+searchBarHTML()+'<div class="region-grid"></div>';
      renderRegionsInto(panel.querySelector('.region-grid'), extra);
    }
    function rowHTML(display,key,region,sub,subColor){
      const sty = sub ? (' style="--c:'+subColor+'"') : '';
      return '<div class="school-row'+(sub?' sub':'')+(isSel(cat,key)?' selected':'')+'" '+
        'data-key="'+key+'" data-name="'+display+'" data-region="'+region+'" data-sub="'+(sub?1:'')+'"'+sty+'>'+
        '<span class="sr-name">'+display+'</span></div>';
    }
    function showSchools(region){
      const isExtra = extra && region===extra.label;
      let rows='', headCount=0, unit='개교';
      if(isExtra){
        rows=extra.items.map(n=>rowHTML(n,n,region,false)).join('');
        headCount=extra.items.length; unit='개';
      } else {
        const schools=SCHOOLS.filter(s=>s.지역===region).sort((a,b)=>a.학교명.localeCompare(b.학교명,'ko'));
        headCount=schools.length;
        rows=schools.map(s=>rowHTML(s.학교명,s.학교명,region,false)).join('');
        const sg=SUBGROUP[cat];
        if(sg){
          rows+='<div class="sub-sep" style="color:'+sg.color+';border-color:'+sg.color+'55">'+sg.label+'</div>';
          rows+=sg.items.map(n=>rowHTML(n, region+'|'+n, region, true, sg.color)).join('');
        }
      }
      panel.innerHTML='<h2>'+icon+' '+cat+' <span class="badge" style="background:'+color+'">'+region+' · '+headCount+unit+'</span></h2>'+
        '<button class="back-btn" data-back="1">← 지역 선택으로</button>'+
        '<div class="school-list">'+rows+'</div>';
    }
    panel.addEventListener('click',e=>{
      const reg=e.target.closest('button[data-region]');
      if(reg){ showSchools(reg.dataset.region); return; }
      if(e.target.closest('[data-back]')){ showRegions(); return; }
      const row=e.target.closest('.school-row');
      if(row){
        const sub=row.dataset.sub==='1';
        toggleSel(cat,row.dataset.key,{region:row.dataset.region,name:row.dataset.name,sub:sub});
        row.classList.toggle('selected');
      }
    });
    wireSearch(panel,'select',cat);
    panel._home=showRegions;
    showRegions();
    return panel;
  }
  // 공사 진행단계 저장소 (학교|지역별 공사명->단계), 업무일지와 공유
  let WSTAT={}; try{ WSTAT=JSON.parse(localStorage.getItem('gongsa_status'))||{}; }catch(e){}  // 날짜무관 전역(서버와 공유)
  function saveStat(){ try{ localStorage.setItem('gongsa_status',JSON.stringify(WSTAT)); }catch(e){} }
  // 자재입고확인 시 입고된 시설/자재 내용 메모 (지역|현장 -> 공사명 -> 내용)
  let RECV={}; try{ RECV=JSON.parse(localStorage.getItem('recv_memo'))||{}; }catch(e){}
  function saveRecv(){ try{ localStorage.setItem('recv_memo',JSON.stringify(RECV)); }catch(e){} }
  // ★ 내가 오늘 손댄 공사 항목만 표시(개인·기기·날짜별). WSTAT는 공유, 표시는 개인 기준.
  let MYW={}; function loadMyw(){ try{ MYW=JSON.parse(localStorage.getItem('myw_'+dateKey()))||{}; }catch(e){ MYW={}; } }
  function saveMyw(){ try{ localStorage.setItem('myw_'+dateKey(),JSON.stringify(MYW)); }catch(e){} }
  function mywK(gkey,work){ return gkey+'|||'+work; }
  function markMyw(gkey,work){ MYW[mywK(gkey,work)]=1; saveMyw(); }
  function unmarkMyw(gkey,work){ delete MYW[mywK(gkey,work)]; saveMyw(); }
  loadMyw();
  // ★ 내 견적/문서 변경 추적(델타) — 날짜별. 전송 시 이 부분만 서버로 보냄.
  let MYEST={}, MYDOC={};
  function loadMyd(){ try{ MYEST=JSON.parse(localStorage.getItem('myest_'+dateKey()))||{}; }catch(e){ MYEST={}; } try{ MYDOC=JSON.parse(localStorage.getItem('mydoc_'+dateKey()))||{}; }catch(e){ MYDOC={}; } }
  function saveMyd(){ try{ localStorage.setItem('myest_'+dateKey(),JSON.stringify(MYEST)); localStorage.setItem('mydoc_'+dateKey(),JSON.stringify(MYDOC)); }catch(e){} }
  function markMyest(gkey,name){ MYEST[gkey+'|||'+name]=1; saveMyd(); }
  function markMydoc(gkey,name,field){ MYDOC[gkey+'|||'+name+'|||'+field]=1; saveMyd(); }
  function split2(k){ const i=k.indexOf('|||'); return [k.slice(0,i), k.slice(i+3)]; }
  loadMyd();
  let gongsaRefresh=function(){};
  // 견적서 저장소 (지역|현장 -> [{name,date}]) — 사무에서 작성, 공사에서 사용
  let ESTIMATES={}; try{ ESTIMATES=JSON.parse(localStorage.getItem('estimates'))||{}; }catch(e){}
  function saveEst(){ try{ localStorage.setItem('estimates',JSON.stringify(ESTIMATES)); }catch(e){} }
  // ★ 문서기록(발주서·청구서·사진대지·세금계산서) — 지역|현장 -> 공사명 -> {발주,청구,사진대지,세금계산서}
  let DOCREC={}; try{ DOCREC=JSON.parse(localStorage.getItem('docrec'))||{}; }catch(e){}
  function saveDoc(){ try{ localStorage.setItem('docrec',JSON.stringify(DOCREC)); }catch(e){} }
  function docGet(gkey,name){ return (DOCREC[gkey]&&DOCREC[gkey][name])||{}; }
  function docSet(gkey,name,field,val){
    DOCREC[gkey]=DOCREC[gkey]||{}; DOCREC[gkey][name]=DOCREC[gkey][name]||{};
    if(val===null) delete DOCREC[gkey][name][field]; else DOCREC[gkey][name][field]=val;
    if(!Object.keys(DOCREC[gkey][name]).length) delete DOCREC[gkey][name];
    if(DOCREC[gkey]&&!Object.keys(DOCREC[gkey]).length) delete DOCREC[gkey];
    saveDoc();
  }
  function hasOrder(gkey,name){ return !!docGet(gkey,name).발주; }
  function hasInvoice(gkey,name){ return !!docGet(gkey,name).청구; }
  function curWriter(){ try{ return localStorage.getItem('ilji_writer')||''; }catch(e){ return ''; } }
  const DOCFIELD={'발주서':'발주','청구서':'청구','사진대지작성':'사진대지','세금계산서발행':'세금계산서'};
  function todayStr(){ return dateStr(); }  // 전송·저장 날짜 = 선택한 작업 날짜
  // 한 지역의 현장 목록 = 실제 학교(가나다) + 기타구역 (사무·공사 공통)
  function siteList(region){
    if(region===ETC_REGION.label) return ETC_REGION.items.slice();
    const list=SCHOOLS.filter(s=>s.지역===region).map(s=>s.학교명).sort((a,b)=>a.localeCompare(b,'ko'));
    list.push('기타구역');
    return list;
  }
  const STAGES_ALL=['자재입고확인','자재가공','자재출고준비 완료','공사중','공사완료'];
  const MATERIAL_STAGES=['자재입고확인','자재가공','자재출고준비 완료'];  // 발주서 작성 후 열림
  const STAGE_STYLE={
    '자재입고확인':{bg:'#ffe6bf', fg:'#9a5a16'},
    '자재가공':{bg:'#fac57a', fg:'#8a4d10'},
    '자재출고준비 완료':{bg:'#f2a04a', fg:'#fff'},
    '공사중':{bg:'#ec8d35', fg:'#fff'},
    '공사완료':{bg:'#e8842c', fg:'#fff'}
  };
  const STAGE_NUM={'자재입고확인':'①','자재가공':'②','자재출고준비 완료':'③','공사중':'④','공사완료':'⑤'};
  // 공사: 지역 -> 현장(학교/기타구역) -> 견적서 공사명 -> 진행단계
  function setupConstruction(icon){
    const color='#e8842c';
    const panel=document.getElementById('construct');
    const STAGES=STAGES_ALL;
    let curRegion='', expanded='';
    function head(txt){ return '<h2>'+icon+' 공사 <span class="badge" style="background:'+color+'">'+txt+'</span></h2>'; }
    function showRegions(){
      panel.innerHTML=head('지역 선택')+searchBarHTML()+'<div class="region-grid"></div>';
      renderRegionsInto(panel.querySelector('.region-grid'), ETC_REGION);
    }
    function showSchools(region){
      curRegion=region;
      const rows=siteList(region).map(n=>'<div class="school-row" data-school="'+n+'"><span class="sr-name">'+n+'</span></div>').join('');
      panel.innerHTML=head(region+' · 현장 선택')+'<button class="back-btn" data-back="1">← 지역 선택으로</button><div class="school-list">'+rows+'</div>';
    }
    function statKey(school){ return curRegion+'|'+school; }
    function stageRow(w,cur,ordered){
      const html='<div class="stage-row">'+STAGES.map(st=>{
        const S=STAGE_STYLE[st], on=cur===st;
        if(MATERIAL_STAGES.indexOf(st)>=0 && !ordered){
          return '<button class="stage-btn" data-locked="1" style="opacity:.4;cursor:not-allowed">🔒'+STAGE_NUM[st]+' '+st+'</button>';
        }
        const sty = on ? ('background:'+S.bg+';color:'+S.fg+';border-color:'+S.bg) : ('--c:'+S.bg);
        return '<button class="stage-btn'+(on?' on':'')+'" data-work="'+w+'" data-stage="'+st+'" style="'+sty+'">'+STAGE_NUM[st]+' '+st+'</button>';
      }).join('')+'</div>';
      return html+(ordered?'':'<div class="work-note" style="margin-top:4px">🔒 자재 단계는 사무 → 발주서를 먼저 작성하면 열립니다.</div>');
    }
    function showWork(school){ expanded=''; renderWork(school); }
    function renderWork(school){
      const key=statKey(school);
      const stat=WSTAT[key]||{};
      const ests=ESTIMATES[key]||[];
      let inner;
      if(!ests.length){
        inner='<div class="work-note">사무 → 견적서에서 이 현장의 공사명을 먼저 작성하세요.</div>';
      } else {
        inner='<div class="work-list">'+ests.map(e=>{
          const w=e.name, cur=stat[w]||'';
          const sc=STAGE_STYLE[cur];
          const badge=cur?'<span class="work-stage" style="background:'+sc.bg+';color:'+sc.fg+'">'+STAGE_NUM[cur]+' '+cur+'</span>':'<span class="work-stage off">상태 미정</span>';
          const memo=(RECV[key]&&RECV[key][w])||'';
          let block='<div class="work-item" data-work="'+w+'"><span class="work-name">'+w+'</span><span class="work-date">'+e.date+'</span>'+badge+'</div>';
          if(memo && expanded!==w){ block+='<div class="work-recv">📦 입고: '+memo+'</div>'; }
          if(expanded===w){
            block+=stageRow(w,cur,hasOrder(key,w));
            block+='<div class="recv-box"><label>📦 입고된 시설/자재 내용 <small>(자재입고확인 시 기재)</small></label><textarea class="recv-input" data-recvwork="'+w+'" placeholder="예: 평행봉 2조, 철봉 1조, 늑목 3틀 입고">'+memo.replace(/</g,'&lt;')+'</textarea></div>';
          }
          return block;
        }).join('')+'</div>';
      }
      panel.innerHTML=head(curRegion+' · '+school)+'<button class="back-btn" data-backschool="1">← 현장 목록으로</button>'+
        '<div class="work-wrap" data-school="'+school+'">'+inner+'</div>';
    }
    panel.addEventListener('click',e=>{
      const reg=e.target.closest('button[data-region]');
      if(reg){ showSchools(reg.dataset.region); return; }
      if(e.target.closest('[data-back]')){ showRegions(); return; }
      if(e.target.closest('[data-backschool]')){ showSchools(curRegion); return; }
      const stage=e.target.closest('.stage-btn');
      if(stage){
        if(stage.dataset.locked){ alert('이 공사는 사무 → 발주서를 먼저 작성해야 자재 단계를 진행할 수 있어요.'); return; }
        const school=panel.querySelector('.work-wrap').dataset.school;
        const key=statKey(school), work=stage.dataset.work; WSTAT[key]=WSTAT[key]||{};
        if(MATERIAL_STAGES.indexOf(stage.dataset.stage)>=0 && !hasOrder(key,work)){ alert('발주서를 먼저 작성하세요.'); return; }
        let nv;
        if(WSTAT[key][work]===stage.dataset.stage){ delete WSTAT[key][work]; nv=''; }
        else { WSTAT[key][work]=stage.dataset.stage; nv=stage.dataset.stage; }
        if(!Object.keys(WSTAT[key]).length) delete WSTAT[key];
        if(nv) markMyw(key,work); else unmarkMyw(key,work);
        saveStat(); gongsaPost('stage',{region:curRegion,school:school,name:work,stage:nv}); renderWork(school); renderSummary(); return;
      }
      const work=e.target.closest('.work-item');
      if(work){
        const school=panel.querySelector('.work-wrap').dataset.school;
        expanded=(expanded===work.dataset.work)?'':work.dataset.work;
        renderWork(school); return;
      }
      const sch=e.target.closest('.school-row[data-school]');
      if(sch){ if(sch.dataset.sregion) curRegion=sch.dataset.sregion; showWork(sch.dataset.school); return; }
    });
    let recvTimer=null;
    panel.addEventListener('input',e=>{
      const ta=e.target.closest('.recv-input'); if(!ta) return;
      const wrap=panel.querySelector('.work-wrap'); if(!wrap) return;
      const key=statKey(wrap.dataset.school), w=ta.dataset.recvwork, v=ta.value, sc=wrap.dataset.school, reg=curRegion;
      RECV[key]=RECV[key]||{};
      if(v.trim()) RECV[key][w]=v; else { delete RECV[key][w]; if(!Object.keys(RECV[key]).length) delete RECV[key]; }
      if(v.trim()) markMyw(key,w);
      saveRecv(); renderSummary();
      clearTimeout(recvTimer); recvTimer=setTimeout(()=>{ gongsaPost('recv',{region:reg,school:sc,name:w,recv:v}); }, 800);
    });
    gongsaRefresh=function(){ const w=panel.querySelector('.work-wrap'); if(w) renderWork(w.dataset.school); };
    wireSearch(panel,'goto');
    panel._home=showRegions;
    showRegions();
    return panel;
  }
  // 사무: 지역 -> 현장(학교/기타구역) -> 견적서/발주서/청구서/사진대지작성/세금계산서발행
  function setupEtc(){
    const panel=document.getElementById('etc');
    const cat='사무', color='#8a8f98';
    const DOCS=['견적서','발주서','청구서','사진대지작성','세금계산서발행','방문예정','특이사항'];
    let curRegion='', curSchool='', curRemarkCat='', orderDraft=null;
    function head(txt){ return '<h2>📋 사무 <span class="badge" style="background:'+color+'">'+txt+'</span></h2>'; }
    function showRegions(){
      panel.innerHTML=head('지역 선택')+searchBarHTML()+'<div class="region-grid"></div>';
      const grid=panel.querySelector('.region-grid');
      renderRegionsInto(grid, ETC_REGION);
      grid.insertAdjacentHTML('beforeend',
        '<button class="region-special" data-special="기타업무"><span class="rg-name">기타업무</span><span class="rg-cnt">직접 작성</span></button>'+
        '<button class="region-special" data-special="연차"><span class="rg-name">연차</span><span class="rg-cnt">날짜 선택</span></button>');
    }
    function showSchools(region){
      curRegion=region;
      const cards=siteList(region).map(n=>'<div class="school-row" data-school="'+n+'"><span class="sr-name">'+n+'</span></div>').join('');
      panel.innerHTML=head(region+' · 현장 선택')+'<button class="back-btn" data-backregion="1">← 지역 선택으로</button><div class="school-list">'+cards+'</div>';
    }
    function countDoc(school,doc){
      const pre='사무|'+curRegion+'|'+school+'|'+doc+'|';
      const o=SEL[cat]||{}; let c=0;
      for(const k in o){ if(k.indexOf(pre)===0) c++; }
      return c;
    }
    function showDocs(school){
      curSchool=school;
      const cards=DOCS.map(d=>{
        const n = d==='견적서' ? (ESTIMATES[curRegion+'|'+school]||[]).length : countDoc(school,d);
        return '<div class="school-row" data-doc="'+d+'"><span class="sr-name">'+d+(n?'<span class="doc-count">'+n+'</span>':'')+'</span></div>';
      }).join('');
      panel.innerHTML=head(curRegion+' · '+school)+'<button class="back-btn" data-backschool="1">← 현장 목록으로</button>'+
        '<div class="work-note">견적서에서 공사명을 작성하면, 모든 항목(발주서·청구서·사진대지작성·세금계산서발행)에서 그 공사명을 골라 기록합니다.</div>'+
        '<div class="school-list">'+cards+'</div>';
    }
    function showDocItems(doc){
      const region=curRegion, school=curSchool, gkey=region+'|'+school, fld=DOCFIELD[doc];
      const ests=ESTIMATES[gkey]||[];
      const needInv=(doc==='사진대지작성'||doc==='세금계산서발행');
      let body;
      if(!ests.length){
        body='<div class="work-note">먼저 견적서에서 공사명을 작성하세요.</div>';
      } else {
        const guide = doc==='발주서' ? '공사명을 누르고 발주 내역을 한 줄로 적으세요. (적으면 공사 탭의 자재 단계가 열립니다)'
          : needInv ? '청구서가 작성된 공사만 열립니다. 공사명을 누르면 저장됩니다.'
          : '공사명을 누르면 저장됩니다.';
        body='<div class="work-note">'+guide+'</div>'+
          '<div class="school-list">'+ests.map(e=>{
            const rec=docGet(gkey,e.name)[fld];
            const done=!!rec;
            const locked=needInv && !hasInvoice(gkey,e.name);
            if(locked){
              return '<div class="school-row" style="opacity:.45;cursor:not-allowed"><span class="sr-name">🔒 '+e.name+'</span><span style="margin-left:auto;font-size:12px;color:#999">청구서 먼저</span></div>';
            }
            let sub;
            if(doc==='발주서') sub = done ? ('✓ '+((rec.items&&rec.items[0]&&rec.items[0].vendor)||rec.date||'')+((rec.items&&rec.items.length>1)?(' 외 '+(rec.items.length-1)):'')) : '거래처·내역';
            else sub = done ? ('✓ '+(rec.date||'')) : '클릭 저장';
            return '<div class="school-row'+(done?' selected':'')+'" data-docpick="'+encodeURIComponent(e.name)+'" data-doc="'+doc+'"><span class="sr-name">'+e.name+'</span><span style="margin-left:auto;font-size:12px;color:#888">'+sub+'</span></div>';
          }).join('')+'</div>';
      }
      panel.innerHTML=head(region+' · '+school+' · '+doc)+'<button class="back-btn" data-backdocs="1">← 항목으로</button>'+body;
    }
    // 발주서: 거래처+내역 여러 줄 (+ 거래처 추가)
    function orderRows(name){
      if(orderDraft && orderDraft.name===name) return orderDraft.rows;
      const rec=docGet(curRegion+'|'+curSchool,name).발주||{};
      const rows=(rec.items&&rec.items.length)?rec.items.map(it=>({v:it.vendor||'',d:it.detail||''})):[{v:'',d:''}];
      orderDraft={name:name, rows:rows};
      return rows;
    }
    function readOrderRows(){
      const rows=[]; let i=0;
      while(panel.querySelector('#orderV'+i)){
        rows.push({v:(panel.querySelector('#orderV'+i).value||'').trim(), d:(panel.querySelector('#orderD'+i).value||'').trim()});
        i++;
      }
      return rows;
    }
    function showOrderForm(name){
      const region=curRegion, school=curSchool;
      const rec=docGet(region+'|'+school,name).발주||{};
      const rows=orderRows(name);
      const rowsHtml=rows.map((r,i)=>
        '<div style="display:flex;gap:6px;margin-bottom:6px">'+
          '<input id="orderV'+i+'" class="est-input" style="flex:0 0 38%" type="text" placeholder="거래처" value="'+(r.v||'').replace(/"/g,'&quot;')+'">'+
          '<input id="orderD'+i+'" class="est-input" style="flex:1" type="text" placeholder="내역 (예: 평행봉 2조)" value="'+(r.d||'').replace(/"/g,'&quot;')+'">'+
          (rows.length>1?'<button class="est-add" data-delorderrow="'+i+'" style="flex:0 0 auto;background:#999">×</button>':'')+
        '</div>'
      ).join('');
      panel.innerHTML=head(region+' · '+school+' · 발주서')+'<button class="back-btn" data-backdocitems="발주서">← 발주서 목록</button>'+
        '<div class="work-note"><b>'+name+'</b> · 발주서'+(rec.date?(' (작성 '+rec.date+(rec.writer?(' · '+rec.writer):'')+')'):'')+'</div>'+
        rowsHtml+
        '<div class="visit-form"><button class="est-add" data-addorderrow="'+encodeURIComponent(name)+'" style="background:#7a7f88">+ 거래처 추가</button>'+
        '<button class="est-add" data-saveorder="'+encodeURIComponent(name)+'">저장</button></div>'+
        (rec.date?'<div class="visit-form"><button class="est-add" data-delorder="'+encodeURIComponent(name)+'" style="background:#c0392b">발주서 삭제</button></div>':'');
    }
    function showEstimate(school){
      const key=curRegion+'|'+school;
      const ests=ESTIMATES[key]||[];
      const items=ests.length? ests.map((e,i)=>'<div class="est-item"><span class="est-name">'+e.name+'</span><span class="est-date">'+e.date+'</span><i class="est-del" data-delest="'+i+'">×</i></div>').join('')
        : '<div class="sum-empty">작성된 공사명이 없습니다.</div>';
      panel.innerHTML=head(curRegion+' · '+school+' · 견적서')+'<button class="back-btn" data-backdocs="1">← 항목으로</button>'+
        '<div class="est-form"><input id="estInput" class="est-input" type="text" placeholder="공사명 입력 후 추가"><button class="est-add" data-addest="1">추가</button></div>'+
        '<div class="est-list">'+items+'</div>';
    }
    // 방문예정: 달력에서 날짜·시간 선택 + 방문목적 직접입력
    function showVisit(){
      const region=curRegion, school=curSchool;
      const pre='사무|'+region+'|'+school+'|방문예정|';
      const o=SEL[cat]||{};
      const list=Object.keys(o).filter(k=>k.indexOf(pre)===0).map(k=>({k:k,v:o[k]}));
      list.sort((a,b)=>(a.v.visitWhen||'').localeCompare(b.v.visitWhen||''));
      const items=list.length? list.map(it=>'<div class="est-item"><span class="est-name">📅 '+(it.v.visitWhen||'')+'</span><span class="est-purpose">'+(it.v.purpose||'(목적 미입력)')+'</span><i class="est-del" data-delvisit="'+encodeURIComponent(it.k)+'">×</i></div>').join('')
        : '<div class="sum-empty">등록된 방문예정이 없습니다.</div>';
      panel.innerHTML=head(region+' · '+school+' · 방문예정')+'<button class="back-btn" data-backdocs="1">← 항목으로</button>'+
        '<div class="work-note">달력에서 방문 날짜·시간을 고르고, 방문 목적을 적은 뒤 「추가」를 누르세요.</div>'+
        '<div class="visit-form"><input id="visitWhen" class="est-input" type="datetime-local"><input id="visitPurpose" class="est-input" type="text" placeholder="방문 목적 입력 (예: 현장 실측, 하자 점검)"><button class="est-add" data-addvisit="1">추가</button></div>'+
        '<div class="est-list">'+items+'</div>';
    }
    // 특이사항: 점검·소독·공사·사무 중 골라 메모 작성
    function showRemark(){
      const region=curRegion, school=curSchool;
      const cats=['점검','소독','공사','사무'];
      const btns=cats.map(c=>{
        const pre='사무|'+region+'|'+school+'|특이사항|'+c+'|';
        const o=SEL[cat]||{}; let n=0; for(const k in o){ if(k.indexOf(pre)===0) n++; }
        return '<button class="remark-cat" data-rcat="'+c+'" style="--rc:'+CAT_COLORS[c]+'">'+c+(n?'<span class="doc-count">'+n+'</span>':'')+'</button>';
      }).join('');
      panel.innerHTML=head(region+' · '+school+' · 특이사항')+'<button class="back-btn" data-backdocs="1">← 항목으로</button>'+
        '<div class="work-note">특이사항을 적을 항목을 고르세요. (점검·소독·공사·사무)</div>'+
        '<div class="remark-cats">'+btns+'</div>';
    }
    function showRemarkInput(rcat){
      curRemarkCat=rcat;
      const region=curRegion, school=curSchool;
      const pre='사무|'+region+'|'+school+'|특이사항|'+rcat+'|';
      const o=SEL[cat]||{};
      const list=Object.keys(o).filter(k=>k.indexOf(pre)===0).map(k=>({k:k,v:o[k]}));
      const items=list.length? list.map(it=>'<div class="est-item"><span class="est-purpose">'+(it.v.remarkText||'')+'</span><i class="est-del" data-delremark="'+encodeURIComponent(it.k)+'">×</i></div>').join('')
        : '<div class="sum-empty">작성된 특이사항이 없습니다.</div>';
      panel.innerHTML=head(region+' · '+school+' · 특이사항 · '+rcat)+'<button class="back-btn" data-backremark="1">← 항목 선택으로</button>'+
        '<div class="visit-form"><input id="remarkText" class="est-input" type="text" placeholder="'+rcat+' 특이사항 입력"><button class="est-add" data-addremark="1">추가</button></div>'+
        '<div class="est-list">'+items+'</div>';
    }
    // 기타업무: 지역·현장과 무관하게 업무 내용 직접 작성
    function showEtcWork(){
      const o=SEL[cat]||{};
      const list=Object.keys(o).filter(k=>o[k].type==='기타업무').map(k=>({k:k,v:o[k]}));
      const items=list.length? list.map(it=>'<div class="est-item"><span class="est-purpose">'+(it.v.workText||'')+'</span><i class="est-del" data-deletcwork="'+encodeURIComponent(it.k)+'">×</i></div>').join('')
        : '<div class="sum-empty">작성된 기타업무가 없습니다.</div>';
      panel.innerHTML=head('기타업무')+'<button class="back-btn" data-backregion="1">← 지역 선택으로</button>'+
        '<div class="work-note">지역·현장과 상관없는 업무 내용을 직접 적으세요.</div>'+
        '<div class="visit-form"><input id="etcWorkText" class="est-input" type="text" placeholder="기타업무 내용 입력"><button class="est-add" data-addetcwork="1">추가</button></div>'+
        '<div class="est-list">'+items+'</div>';
    }
    // 연차: 달력에서 날짜 선택 (작성자는 상단 이름으로 기록)
    function showAnnual(){
      const o=SEL[cat]||{};
      const list=Object.keys(o).filter(k=>o[k].type==='연차').map(k=>({k:k,v:o[k]}));
      list.sort((a,b)=>(a.v.leaveDate||'').localeCompare(b.v.leaveDate||''));
      const items=list.length? list.map(it=>'<div class="est-item"><span class="est-name">📅 '+(it.v.leaveDate||'')+'</span><i class="est-del" data-delannual="'+encodeURIComponent(it.k)+'">×</i></div>').join('')
        : '<div class="sum-empty">지정된 연차가 없습니다.</div>';
      panel.innerHTML=head('연차')+'<button class="back-btn" data-backregion="1">← 지역 선택으로</button>'+
        '<div class="work-note">달력에서 연차 사용 날짜를 고르고 「추가」를 누르세요. 작성자는 상단에서 고른 이름으로 기록됩니다.</div>'+
        '<div class="visit-form"><input id="annualDate" class="est-input" type="date"><button class="est-add" data-addannual="1">추가</button></div>'+
        '<div class="est-list">'+items+'</div>';
    }
    panel.addEventListener('click',e=>{
      const reg=e.target.closest('[data-region]');
      if(reg){ showSchools(reg.dataset.region); return; }
      if(e.target.closest('[data-backregion]')){ showRegions(); return; }
      const sp=e.target.closest('[data-special]');
      if(sp){ if(sp.dataset.special==='기타업무') showEtcWork(); else if(sp.dataset.special==='연차') showAnnual(); return; }
      if(e.target.closest('[data-addetcwork]')){
        const inp=panel.querySelector('#etcWorkText'); const txt=(inp&&inp.value||'').trim();
        if(!txt){ alert('기타업무 내용을 입력하세요.'); return; }
        const k='사무|기타업무|'+Date.now();
        SEL[cat]=SEL[cat]||{}; SEL[cat][k]={region:'사무', name:txt, tag:'기타업무', type:'기타업무', workText:txt};
        saveSel(); renderSummary(); showEtcWork(); return;
      }
      const dew=e.target.closest('[data-deletcwork]');
      if(dew){ const k=decodeURIComponent(dew.dataset.deletcwork); if(SEL[cat]&&SEL[cat][k]){ delete SEL[cat][k]; if(!Object.keys(SEL[cat]).length) delete SEL[cat]; saveSel(); renderSummary(); } showEtcWork(); return; }
      if(e.target.closest('[data-addannual]')){
        const inp=panel.querySelector('#annualDate'); const dv=(inp&&inp.value||'');
        if(!dv){ alert('연차 날짜를 먼저 선택하세요.'); return; }
        const k='사무|연차|'+dv;
        SEL[cat]=SEL[cat]||{}; SEL[cat][k]={region:'사무', name:'연차 '+dv, tag:'연차', type:'연차', leaveDate:dv};
        saveSel(); renderSummary(); showAnnual(); return;
      }
      const da=e.target.closest('[data-delannual]');
      if(da){ const k=decodeURIComponent(da.dataset.delannual); if(SEL[cat]&&SEL[cat][k]){ delete SEL[cat][k]; if(!Object.keys(SEL[cat]).length) delete SEL[cat]; saveSel(); renderSummary(); } showAnnual(); return; }
      if(e.target.closest('[data-backschool]')){ showSchools(curRegion); return; }
      if(e.target.closest('[data-backdocs]')){ showDocs(curSchool); return; }
      if(e.target.closest('[data-addest]')){
        const inp=panel.querySelector('#estInput'); const v=(inp&&inp.value||'').trim();
        if(v){ const key=curRegion+'|'+curSchool; ESTIMATES[key]=ESTIMATES[key]||[]; ESTIMATES[key].push({name:v,date:todayStr()}); saveEst(); markMyest(key,v); }
        showEstimate(curSchool); return;
      }
      const del=e.target.closest('[data-delest]');
      if(del){
        const key=curRegion+'|'+curSchool; const i=+del.dataset.delest;
        const removed=ESTIMATES[key]&&ESTIMATES[key][i];
        if(removed){
          ESTIMATES[key].splice(i,1);
          if(!ESTIMATES[key].length) delete ESTIMATES[key];
          if(WSTAT[key]){ delete WSTAT[key][removed.name]; if(!Object.keys(WSTAT[key]).length) delete WSTAT[key]; saveStat(); }
          if(RECV[key]){ delete RECV[key][removed.name]; if(!Object.keys(RECV[key]).length) delete RECV[key]; saveRecv(); }
          saveEst(); markMyest(key,removed.name); renderSummary();
        }
        showEstimate(curSchool); return;
      }
      if(e.target.closest('[data-addvisit]')){
        const w=panel.querySelector('#visitWhen'), pp=panel.querySelector('#visitPurpose');
        const when=(w&&w.value||'').replace('T',' ');
        const purpose=(pp&&pp.value||'').trim();
        if(!when){ alert('방문 날짜·시간을 먼저 선택하세요.'); return; }
        const k='사무|'+curRegion+'|'+curSchool+'|방문예정|'+when+'|'+purpose;
        SEL[cat]=SEL[cat]||{};
        SEL[cat][k]={region:'사무·'+curRegion, name:curSchool+' · '+when+(purpose?' ('+purpose+')':''), tag:'방문예정', visitWhen:when, purpose:purpose};
        saveSel(); renderSummary(); showVisit(); return;
      }
      const dv=e.target.closest('[data-delvisit]');
      if(dv){
        const k=decodeURIComponent(dv.dataset.delvisit);
        if(SEL[cat]&&SEL[cat][k]){ delete SEL[cat][k]; if(!Object.keys(SEL[cat]).length) delete SEL[cat]; saveSel(); renderSummary(); }
        showVisit(); return;

  function buildGroups(){

    function push(cat,label,color,filterFn){
      if(!SEL[cat]) return;
      const entries=Object.keys(SEL[cat]).filter(k=>filterFn(SEL[cat][k]))
        .map(k=>({key:k,name:SEL[cat][k].name||k,region:SEL[cat][k].region,tag:SEL[cat][k].tag}));
      if(entries.length) groups.push({label:label,color:color,cat:cat,entries:entries});

        const entries=[];
        // ★ 내가 오늘 손댄 공사(MYW)만 표시. 단계가 사라진 항목은 제외.
        Object.keys(MYW||{}).forEach(mk=>{
          const sep=mk.indexOf('|||'); if(sep<0) return;
          const gkey=mk.slice(0,sep), work=mk.slice(sep+3);
          if(!(WSTAT[gkey] && WSTAT[gkey][work])) return;
          const parts=gkey.split('|'); const region=parts[0], school=parts.slice(1).join('|');
          const ests=ESTIMATES[gkey]||[];
          const est=ests.find(x=>x.name===work); const dt=est?est.date:'';
          const rmemo=(RECV[gkey]&&RECV[gkey][work])||'';
          entries.push({region:region, name:school+' · '+work+(dt?' ('+dt+')':'')+(rmemo?' 📦'+rmemo:''), tag:WSTAT[gkey][work], gkey:gkey, work:work});
        });
        if(entries.length) groups.push({label:'공사',color:CAT_COLORS['공사'],cat:'공사',entries:entries});
        return;
      }
      const sg=SUBGROUP[cat];
      if(sg){
        push(cat,cat,CAT_COLORS[cat],v=>!isSub(v));
        push(cat,sg.label,sg.color,v=>isSub(v));
      } else {
        push(cat,cat,CAT_COLORS[cat],()=>true);
      }
      if(cat==='사무'){
        // ★ 견적서 작성(MYEST)도 오늘의 업무에 표시 (삭제는 사무 탭 견적서 화면에서)
        const estEntries=[];
        Object.keys(MYEST||{}).forEach(mk=>{
          const sep=mk.indexOf('|||'); if(sep<0) return;
          const gkey=mk.slice(0,sep), nm=mk.slice(sep+3);
          const e2=(ESTIMATES[gkey]||[]).find(x=>x.name===nm); if(!e2) return;
          const parts=gkey.split('|');
          estEntries.push({key:'', name:parts.slice(1).join('|')+' · '+nm, region:'사무·'+parts[0], tag:'견적서', noDel:true});
        });
        if(estEntries.length){
          let g=groups.find(x=>x.cat==='사무');
          if(g) g.entries=estEntries.concat(g.entries);
          else groups.push({label:'사무',color:CAT_COLORS['사무'],cat:'사무',entries:estEntries});
        }
      }
    });
    return groups;
  }

  var PINOK=false;
  function pinHash(name,pin){ var s=name+'|'+pin+'|awesome2026'; var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'h'+(h>>>0).toString(36)+s.length; }

  var __pinSeq=0;
  function verifyPin(name,hash,done){
    var cbName='__pinCb'+(++__pinSeq);
    var to=setTimeout(function(){ cleanup(); done(false,false,true); },12000);
    function cleanup(){ clearTimeout(to); try{ delete window[cbName]; }catch(e){ window[cbName]=null; } }
    window[cbName]=function(res){ cleanup(); res=res||{}; done(!!res.ok, !!res.registered, false); };
    var s=document.createElement('script');
    s.src=APPS_URL+'?action=pin&writer='+encodeURIComponent(name)+'&hash='+encodeURIComponent(hash)+'&callback='+cbName+'&t='+Date.now();
    s.onload=function(){ s.remove(); };

  function pinGate(name,onPass,onFail){
    var saved=''; try{ saved=localStorage.getItem(pinKey(name))||''; }catch(e){}
    function tryHash(hash,silent){
      verifyPin(name,hash,function(ok,registered,netFail){
        if(netFail){ alert('인터넷 연결을 확인하세요. 본인 확인을 못 했어요.'); onFail(); return; }
        if(ok){ try{ localStorage.setItem(pinKey(name),hash); }catch(e){} PINOK=true;
          if(registered) alert('비밀번호가 등록되었어요. 다음부터 이 번호로 본인 확인을 해요.\n(잊으면 김재성님께 초기화를 요청하세요)');

        try{ localStorage.removeItem(pinKey(name)); }catch(e){}

        var p=askPin(name); if(p===null){ onFail(); return; }
        tryHash(pinHash(name,p),false);
      });

    var rows=((res&&res.rows)||[]).filter(function(r){ return String(r[6]||'')===w; });
    var tb=document.getElementById('aeRows');
    tb.innerHTML=rows.map(function(r){ return aeRowHTML([r[0],r[1],r[2],r[3],r[4],r[5]]); }).join('');
    // 견적서 행(분류=사무, 내용=견적서)에 원본 태그 부여 → 이름변경·삭제 추적
    aeOrigEsts=[];
    var trs=tb.querySelectorAll('tr');
    rows.forEach(function(r,i){
      if(String(r[0])==='사무' && String(r[3])==='견적서' && trs[i]){
        var gk=String(r[1]||'')+'|'+String(r[2]||''), nm=String(r[4]||'');
        if(gk!=='|' && nm){ trs[i].dataset.oest=gk+'|||'+nm; aeOrigEsts.push({gk:gk,name:nm}); }
      }
    });
    document.getElementById('aeMsg').textContent=rows.length
      ? (w+' 님의 '+document.getElementById('aeDate').value+' 기록 '+rows.length+'건 — 고치거나 지우고 「저장」을 누르세요.')
      : (w+' 님은 이 날짜에 전송한 기록이 없어요. 「＋ 행 추가」로 대신 작성할 수 있어요.');
  };
  function aeLoad(){
    document.getElementById('aeMsg').textContent='불러오는 중...';
    var s=document.createElement('script');
    s.src=APPS_URL+'?action=day&date='+encodeURIComponent(document.getElementById('aeDate').value||dateStr())+'&callback=__aeDay&t='+Date.now();
    s.onload=function(){s.remove();};
    s.onerror=function(){s.remove(); document.getElementById('aeMsg').textContent='불러오기 실패 — 인터넷 연결을 확인하세요.';};
    document.body.appendChild(s);
  }
  function aeCollect(){
    var dt=document.getElementById('aeDate').value, rows=[];
    document.querySelectorAll('#aeRows tr').forEach(function(tr){
      var g=function(c){var el=tr.querySelector('.'+c);return el?String(el.value||'').trim():'';};
      var row=[dt,g('ae-cat'),g('ae-region'),g('ae-site'),g('ae-item'),g('ae-stage'),g('ae-memo')];
      if(row[2]||row[3]||row[4]||row[5]||row[6]) rows.push(row);
    });
    return rows;
  }
  // 현재 표의 견적서 행을 읽어 확정현황(estimates)에 반영할 작업을 만든다.
  // 이름이 바뀌면 연결된 공사단계·입고·문서기록(wstat/recv/docrec)도 함께 옮긴다.
  function aeBuildEstSync(){
    var cur=[], seen={}, renamedFrom={};
    document.querySelectorAll('#aeRows tr').forEach(function(tr){
      var g=function(c){ var el=tr.querySelector('.'+c); return el?String(el.value||'').trim():''; };
      if(g('ae-cat')!=='사무' || g('ae-item')!=='견적서') return;
      var region=g('ae-region'), site=g('ae-site'), name=g('ae-stage'), memo=g('ae-memo');
      if(!region || !site || !name) return;
      var gk=region+'|'+site;
      var orig=tr.dataset.oest||'', oldgk='', oldname='';
      if(orig){ var s=orig.indexOf('|||'); oldgk=orig.slice(0,s); oldname=orig.slice(s+3); }
      var date=(memo.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]||'';
      cur.push({gk:gk,name:name,date:date,oldgk:oldgk,oldname:oldname});
      seen[gk+'|||'+name]=1;
      if(oldname && (oldgk!==gk || oldname!==name)) renamedFrom[oldgk+'|||'+oldname]=1;
    });
    var dels=[];
    (aeOrigEsts||[]).forEach(function(o){
      var key=o.gk+'|||'+o.name;
      if(!seen[key] && !renamedFrom[key]) dels.push(o);
    });
    if(!cur.length && !dels.length) return null;
    return function(m){
      m.estimates=m.estimates||{}; m.wstat=m.wstat||{}; m.recv=m.recv||{}; m.docrec=m.docrec||{};
      function moveLinked(store, oldgk, oldname, gk, name){
        if(store[oldgk] && store[oldgk][oldname]!=null){
          var v=store[oldgk][oldname]; delete store[oldgk][oldname];
          if(!Object.keys(store[oldgk]).length) delete store[oldgk];
          store[gk]=store[gk]||{}; store[gk][name]=v;
        }
      }
      function dropLinked(store, gk, name){
        if(store[gk]){ delete store[gk][name]; if(!Object.keys(store[gk]).length) delete store[gk]; }
      }
      cur.forEach(function(c){
        // 이름(또는 현장) 변경 → 옛 항목 제거 + 연결기록 이동
        if(c.oldname && (c.oldgk!==c.gk || c.oldname!==c.name)){
          if(m.estimates[c.oldgk]){
            var oi=m.estimates[c.oldgk].findIndex(function(y){return y.name===c.oldname;});
            if(oi>=0){ if(!c.date) c.date=m.estimates[c.oldgk][oi].date||''; m.estimates[c.oldgk].splice(oi,1); if(!m.estimates[c.oldgk].length) delete m.estimates[c.oldgk]; }
          }
          moveLinked(m.wstat, c.oldgk, c.oldname, c.gk, c.name);
          moveLinked(m.recv, c.oldgk, c.oldname, c.gk, c.name);
          moveLinked(m.docrec, c.oldgk, c.oldname, c.gk, c.name);
        }
        var arr=m.estimates[c.gk]=m.estimates[c.gk]||[];
        var idx=arr.findIndex(function(y){return y.name===c.name;});
        if(idx<0) arr.push({name:c.name, date:c.date||dateStr()});
        else if(c.date) arr[idx].date=c.date;
      });
      dels.forEach(function(d){
        if(m.estimates[d.gk]){
          var di=m.estimates[d.gk].findIndex(function(y){return y.name===d.name;});
          if(di>=0){ m.estimates[d.gk].splice(di,1); if(!m.estimates[d.gk].length) delete m.estimates[d.gk]; }
        }
        dropLinked(m.wstat, d.gk, d.name);
        dropLinked(m.recv, d.gk, d.name);
        dropLinked(m.docrec, d.gk, d.name);
      });
    };
  }
  function aeApplyMaster(rows){
    var stageRows=rows.filter(function(r){ return r[1]==='공사' && r[3] && r[4] && r[5]; });
    var estSync=aeBuildEstSync();
    if(!stageRows.length && !estSync) return;
    window.__aeMaster=function(m){
      m=m||{}; m.estimates=m.estimates||{}; m.wstat=m.wstat||{}; m.recv=m.recv||{}; m.docrec=m.docrec||{};
      stageRows.forEach(function(r){ var gk=(r[2]||'')+'|'+r[3]; m.wstat[gk]=m.wstat[gk]||{}; m.wstat[gk][r[4]]=r[5]; });
      if(estSync) estSync(m);
      fetch(APPS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'setmaster', master:m, pinHash:myPinHash()})})
        .then(function(){ __applyMaster(m); });
    };
    var s=document.createElement('script');
    s.src=APPS_URL+'?action=master&callback=__aeMaster&t='+Date.now();
    s.onload=function(){s.remove();}; s.onerror=function(){s.remove();};
    document.body.appendChild(s);
  }
  function aeSave(){
    var w=document.getElementById('aeWriter').value, dt=document.getElementById('aeDate').value;
    var rows=aeCollect();
    if(!confirm(w+' 님 명의로 ['+dt+'] 기록 '+rows.length+'건을 저장할까요?\n(빈 표로 저장하면 그 날 기록을 모두 지운 것으로 처리돼요)')) return;
    var btn=document.getElementById('aeSave'); btn.disabled=true; btn.textContent='저장 중...';
    fetch(APPS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'submit', writer:w, pinHash:'', adminHash:myPinHash(), date:dt, delta:{est:[],stage:[],recv:[],doc:[]}, rows:rows, sel:{}})})
      .then(function(){
        if(document.getElementById('aeApplyStage').checked) aeApplyMaster(rows);
        btn.textContent='저장 완료 ✓'; setTimeout(function(){btn.textContent='저장(직원 명의)';btn.disabled=false;},2500);
        document.getElementById('aeMsg').textContent='저장됐어요. 전체 일지·주간보고에 바로 반영됩니다.';
      })
      .catch(function(){ alert('저장 실패 — 인터넷 연결을 확인하세요.'); btn.textContent='저장(직원 명의)'; btn.disabled=false; });
  }
  document.getElementById('btnAdminEdit').addEventListener('click',aeOpen);
  document.getElementById('aeLoad').addEventListener('click',aeLoad);
  document.getElementById('aeAdd').addEventListener('click',function(){ document.getElementById('aeRows').insertAdjacentHTML('beforeend',aeRowHTML()); });
  document.getElementById('aeRows').addEventListener('click',function(e){ var t=e.target; if(t&&t.classList&&t.classList.contains('ae-del')){ var tr=t.closest('tr'); if(tr) tr.remove(); } });
  document.getElementById('aeSave').addEventListener('click',aeSave);
  document.getElementById('aeClose').addEventListener('click',function(){ aeOv.style.display='none'; });
  aeOv.addEventListener('click',function(e){ if(e.target===aeOv) aeOv.style.display='none'; });

  buttons[0].click();
  loadMaster();   // 서버 확정현황 불러오기 + 기기복구 시도
  // 저장된 이름이 있으면 본인 확인(이 기기에 비번이 저장돼 있으면 조용히 통과)
  if(wsel.value){
    pinGate(wsel.value,
      function(){ __prevWriter=wsel.value; updateConsolVis(); tryRecover(); },
      function(){ wsel.value=''; try{ localStorage.setItem('ilji_writer',''); }catch(e){} updateConsolVis(); });
  }
</script>
