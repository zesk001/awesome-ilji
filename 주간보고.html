<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어썸조경 주간업무보고</title>
<style>
  :root{
    --green:#1e5631; --green-lt:#e8f1ea; --line:#dde5df;
    --c점검:#2e7d32; --c소독:#0277bd; --c공사:#ef6c00; --c사무:#6a1b9a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif; background:#f0f3f1; color:#222;}

  /* ── 화면 상단 컨트롤(인쇄 시 숨김) ── */
  .toolbar{max-width:880px; margin:14px auto 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:0 10px;}
  .toolbar button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; font-family:inherit;}
  .toolbar button:hover{background:var(--green-lt);}
  .toolbar .print{background:var(--green); color:#fff; border-color:var(--green); font-weight:bold; margin-left:auto;}
  .toolbar .print:hover{background:#164326;}
  #weekLabel{font-weight:bold; font-size:15px; color:var(--green);}
  #loadMsg{font-size:13px; color:#888;}

  /* ── A4 용지 ── */
  .paper{background:#fff; max-width:880px; margin:10px auto 30px; padding:24px 28px; box-shadow:0 2px 10px rgba(0,0,0,.12); border-radius:6px;}

  /* 헤더 */
  .rpt-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid var(--green); padding-bottom:8px; margin-bottom:12px;}
  .rpt-head h1{font-size:21px; color:var(--green); letter-spacing:1px;}
  .rpt-head .period{font-size:14px; font-weight:bold;}
  .rpt-head .gen{font-size:11px; color:#888; text-align:right;}

  /* 요약 칩 */
  .chips{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;}
  .chip{background:var(--green-lt); border-radius:8px; padding:8px 6px; text-align:center;}
  .chip .num{font-size:20px; font-weight:bold; color:var(--green);}
  .chip .lbl{font-size:11px; color:#555; margin-top:2px;}

  /* 카드 공통 */
  .grid2{display:grid; grid-template-columns:1.15fr 1fr; gap:10px; margin-bottom:10px;}
  .card{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fff;}
  .card h2{font-size:13px; color:var(--green); background:var(--green-lt); margin:-10px -12px 8px; padding:7px 12px; border-radius:8px 8px 0 0;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th{background:#f4f6f5; border-bottom:1.5px solid var(--line); padding:4px 5px; text-align:left; font-size:11px; color:#555;}
  td{border-bottom:1px solid #eef1ef; padding:4px 5px; vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .tnum{text-align:center;}
  .sum-row td{font-weight:bold; background:#fafcfa; border-top:1.5px solid var(--line);}
  .empty{color:#999; font-size:12px; padding:8px 2px;}

  /* ② 차트 */
  .chartwrap{display:flex; align-items:center; gap:14px;}
  .legend{flex:1; font-size:12px;}
  .legend div{display:flex; align-items:center; gap:6px; margin:4px 0;}
  .dot{width:11px; height:11px; border-radius:3px; flex:none;}
  .legend .pct{margin-left:auto; font-weight:bold;}

  /* 분류 배지 */
  .badge{display:inline-block; font-size:10px; color:#fff; border-radius:4px; padding:1px 6px; margin-right:2px;}

  @media (max-width:700px){ .grid2{grid-template-columns:1fr;} .chips{grid-template-columns:repeat(2,1fr);} }

  /* ── 인쇄: A4 한 장 ── */
  @page{ size:A4 portrait; margin:9mm; }
  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .paper{box-shadow:none; border-radius:0; max-width:none; margin:0; padding:0;}
    .card{break-inside:avoid;}
    table{font-size:10.5px;}
    th{font-size:10px;}
    .chip .num{font-size:17px;}
    .rpt-head h1{font-size:19px;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="moveWeek(-1)">◀ 지난주</button>
  <span id="weekLabel"></span>
  <button onclick="moveWeek(1)">다음주 ▶</button>
  <button onclick="loadWeek()">새로고침</button>
  <span id="loadMsg"></span>
  <button class="print" onclick="window.print()">🖨 인쇄 (A4)</button>
</div>

<div class="paper">
  <div class="rpt-head">
    <h1>어썸조경 주간업무보고</h1>
    <div class="period" id="periodTxt"></div>
    <div class="gen" id="genTxt"></div>
  </div>

  <div class="chips">
    <div class="chip"><div class="num" id="chipTotal">-</div><div class="lbl">총 기록 건수</div></div>
    <div class="chip"><div class="num" id="chipWriters">-</div><div class="lbl">작성 인원</div></div>
    <div class="chip"><div class="num" id="chipGongsa">-</div><div class="lbl">공사 진행 현장</div></div>
    <div class="chip"><div class="num" id="chipField">-</div><div class="lbl">점검·소독 건수</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>① 작성자별 건수</h2>
      <div id="secWriter"></div>
    </div>
    <div class="card">
      <h2>② 분류별 비율</h2>
      <div id="secCat"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:10px;">
    <h2>③ 공사 진행단계 현황 <span style="font-weight:normal;color:#777;">(현장별 이번 주 마지막 단계)</span></h2>
    <div id="secGongsa"></div>
  </div>

  <div class="card">
    <h2>④ 연차 · 특이사항 · 기타업무 · 방문예정</h2>
    <div id="secEtc"></div>
  </div>
</div>

<script>
const APPS_URL='https://script.google.com/macros/s/AKfycbzrITG1l2MkXIZwidtDntcKajVJ6fYc94Ejxmjs_16XazYd7pRC9trsbKdAdPV9drhrtQ/exec';
const CATS=['점검','소독','공사','사무'];
const CATCOLOR={'점검':'#2e7d32','소독':'#0277bd','공사':'#ef6c00','사무':'#6a1b9a'};

/* ── 주(월~일) 계산 ── */
let weekOffset=0; // 0=이번주, -1=지난주 …
function pad(n){return String(n).padStart(2,'0');}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtK(d){return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')';}
function weekDays(){
  const today=new Date();
  const dow=today.getDay();
  const toMon=(dow===0? -6 : 1-dow);
  const mon=new Date(today); mon.setDate(today.getDate()+toMon+weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); days.push(d);}
  return days;
}
function moveWeek(n){ weekOffset+=n; loadWeek(); }

/* ── JSONP: action=day 를 7일치 호출 ── */
let CBSEQ=0;
function fetchDay(dateStr){
  return new Promise(function(resolve){
    const cb='__wk'+(CBSEQ++);
    let done=false;
    window[cb]=function(res){ done=true; delete window[cb]; resolve((res&&res.rows)||[]); };
    const s=document.createElement('script');
    s.src=APPS_URL+'?action=day&date='+encodeURIComponent(dateStr)+'&callback='+cb+'&t='+Date.now();
    s.onload=function(){ s.remove(); setTimeout(function(){ if(!done){ delete window[cb]; resolve([]); } },4000); };
    s.onerror=function(){ s.remove(); delete window[cb]; resolve([]); };
    document.body.appendChild(s);
  });
}

/* ── 주간 데이터 불러서 렌더 ── */
let loading=false;
async function loadWeek(){
  if(loading) return; loading=true;
  const days=weekDays();
  const ws=fmt(days[0]), we=fmt(days[6]);
  document.getElementById('weekLabel').textContent=ws+' ~ '+we+(weekOffset===0?' (이번 주)':'');
  document.getElementById('periodTxt').textContent='기간: '+ws+' ~ '+we;
  const msg=document.getElementById('loadMsg');
  const all=[]; // {date,cat,region,site,item,stage,memo,writer,time}
  try{
    for(let i=0;i<7;i++){
      msg.textContent='불러오는 중… ('+(i+1)+'/7)';
      const rows=await fetchDay(fmt(days[i]));
      rows.forEach(function(r){
        all.push({date:fmt(days[i]), dateK:fmtK(days[i]),
          cat:String(r[0]||''), region:String(r[1]||''), site:String(r[2]||''),
          item:String(r[3]||''), stage:String(r[4]||''), memo:String(r[5]||''),
          writer:String(r[6]||''), time:Number(r[7])||0});
      });
    }
    msg.textContent='';
  }catch(e){ msg.textContent='⚠ 불러오기 오류 — 인터넷 연결을 확인하세요'; }
  render(all);
  loading=false;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(all){
  const now=new Date();
  document.getElementById('genTxt').innerHTML='생성: '+fmt(now)+' '+pad(now.getHours())+':'+pad(now.getMinutes())+'<br>어썸조경 일일업무일지 자동취합';

  /* 요약 칩 */
  const writers={}; all.forEach(r=>{ if(r.writer) writers[r.writer]=1; });
  const fieldCnt=all.filter(r=>r.cat==='점검'||r.cat==='소독').length;

  /* ① 작성자별 건수 */
  const byW={};
  all.forEach(r=>{ const w=r.writer||'(미상)'; byW[w]=byW[w]||{점검:0,소독:0,공사:0,사무:0,합:0};
    if(byW[w][r.cat]!==undefined) byW[w][r.cat]++; byW[w].합++; });
  let h='<table><tr><th>작성자</th><th class="tnum">점검</th><th class="tnum">소독</th><th class="tnum">공사</th><th class="tnum">사무</th><th class="tnum">합계</th></tr>';
  const wkeys=Object.keys(byW).sort();
  if(!wkeys.length) h+='<tr><td colspan="6" class="empty">이번 주 전송된 기록이 없습니다</td></tr>';
  wkeys.forEach(w=>{ const o=byW[w];
    h+='<tr><td><b>'+esc(w)+'</b></td><td class="tnum">'+(o.점검||'')+'</td><td class="tnum">'+(o.소독||'')+'</td><td class="tnum">'+(o.공사||'')+'</td><td class="tnum">'+(o.사무||'')+'</td><td class="tnum"><b>'+o.합+'</b></td></tr>'; });
  if(wkeys.length){
    const t={점검:0,소독:0,공사:0,사무:0,합:0};
    wkeys.forEach(w=>{CATS.forEach(c=>t[c]+=byW[w][c]); t.합+=byW[w].합;});
    h+='<tr class="sum-row"><td>합계</td><td class="tnum">'+t.점검+'</td><td class="tnum">'+t.소독+'</td><td class="tnum">'+t.공사+'</td><td class="tnum">'+t.사무+'</td><td class="tnum">'+t.합+'</td></tr>';
  }
  h+='</table>';
  document.getElementById('secWriter').innerHTML=h;

  /* ② 분류별 비율 (도넛 SVG) */
  const byC={점검:0,소독:0,공사:0,사무:0};
  all.forEach(r=>{ if(byC[r.cat]!==undefined) byC[r.cat]++; });
  const tot=all.length;
  if(!tot){ document.getElementById('secCat').innerHTML='<div class="empty">기록 없음</div>'; }
  else{
    const R=42, C=2*Math.PI*R; let off=0;
    let segs='';
    CATS.forEach(c=>{ const frac=byC[c]/tot; if(frac<=0) return;
      segs+='<circle r="'+R+'" cx="55" cy="55" fill="none" stroke="'+CATCOLOR[c]+'" stroke-width="20" stroke-dasharray="'+(frac*C)+' '+C+'" stroke-dashoffset="'+(-off*C)+'" transform="rotate(-90 55 55)"/>';
      off+=frac; });
    let leg='';
    CATS.forEach(c=>{ const n=byC[c]; if(!n) return;
      leg+='<div><span class="dot" style="background:'+CATCOLOR[c]+'"></span>'+c+' '+n+'건<span class="pct">'+Math.round(n/tot*100)+'%</span></div>'; });
    document.getElementById('secCat').innerHTML=
      '<div class="chartwrap"><svg width="110" height="110" viewBox="0 0 110 110">'+segs+
      '<text x="55" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e5631">'+tot+'</text>'+
      '<text x="55" y="67" text-anchor="middle" font-size="9" fill="#777">건</text></svg>'+
      '<div class="legend">'+leg+'</div></div>';
  }

  /* ③ 공사 진행단계 — 현장·공사명별 마지막 단계 */
  const gmap={};
  all.filter(r=>r.cat==='공사').forEach(r=>{
    const k=r.region+'|'+r.site+'|'+r.item;
    if(!gmap[k]||r.date>gmap[k].date||(r.date===gmap[k].date&&r.time>gmap[k].time)) gmap[k]=r;
  });
  const gkeys=Object.keys(gmap).sort();
  if(!gkeys.length){ document.getElementById('secGongsa').innerHTML='<div class="empty">이번 주 공사 기록이 없습니다</div>'; }
  else{
    let g='<table><tr><th>지역</th><th>현장</th><th>공사명</th><th>단계</th><th>비고</th><th>담당</th><th>날짜</th></tr>';
    gkeys.forEach(k=>{ const r=gmap[k];
      g+='<tr><td>'+esc(r.region)+'</td><td><b>'+esc(r.site)+'</b></td><td>'+esc(r.item)+'</td><td><b>'+esc(r.stage)+'</b></td><td>'+esc(r.memo)+'</td><td>'+esc(r.writer)+'</td><td>'+esc(r.dateK)+'</td></tr>'; });
    g+='</table>';
    document.getElementById('secGongsa').innerHTML=g;
  }
  document.getElementById('chipGongsa').textContent=gkeys.length;
  document.getElementById('chipTotal').textContent=tot;
  document.getElementById('chipWriters').textContent=Object.keys(writers).length;
  document.getElementById('chipField').textContent=fieldCnt;

  /* ④ 연차·특이사항·기타업무·방문예정 */
  const ETC=['연차','특이사항','기타업무','방문예정'];
  const etc=all.filter(r=>r.cat==='사무'&&ETC.indexOf(r.item)>=0)
               .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  if(!etc.length){ document.getElementById('secEtc').innerHTML='<div class="empty">이번 주 연차·특이사항·기타업무·방문예정이 없습니다</div>'; }
  else{
    let e='<table><tr><th style="width:70px;">날짜</th><th style="width:60px;">작성자</th><th style="width:90px;">구분</th><th>내용</th></tr>';
    etc.forEach(r=>{
      let gubun=r.item, txt='';
      if(r.item==='연차'){ txt='연차일: '+(r.stage||''); }
      else if(r.item==='특이사항'){ gubun='특이사항'+(r.stage?'('+r.stage+')':''); txt=(r.site?('['+r.region+' '+r.site+'] '):'')+r.memo; }
      else if(r.item==='기타업무'){ txt=r.memo; }
      else if(r.item==='방문예정'){ txt='['+r.region+' '+r.site+'] '+(r.stage?r.stage+' — ':'')+r.memo; }
      e+='<tr><td>'+esc(r.dateK)+'</td><td>'+esc(r.writer)+'</td><td><b>'+esc(gubun)+'</b></td><td>'+esc(txt)+'</td></tr>'; });
    e+='</table>';
    document.getElementById('secEtc').innerHTML=e;
  }
}

loadWeek();
</script>
</body>
</html>
