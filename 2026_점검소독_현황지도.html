<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Malgun Gothic','맑은 고딕',sans-serif; }
body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }

#topbar { background:#1e3a5f; color:#fff; padding:9px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; z-index:1100; }
#topbar h1 { font-size:16px; font-weight:700; }
#topbar select { padding:6px 10px; border-radius:6px; border:none; font-size:14px; font-weight:700; color:#1e3a5f; }
#totals { font-size:13px; display:flex; gap:8px; }
.chip { padding:4px 10px; border-radius:14px; font-weight:700; font-size:12px; }
.chip.i { background:#2563eb; }
.chip.d { background:#0d9488; }
.tb-right { margin-left:auto; display:flex; gap:6px; }
.tb-right button { background:#2d5285; color:#fff; border:none; border-radius:6px; padding:6px 11px; font-size:12px; cursor:pointer; }
.tb-right button:hover { background:#3b82f6; }

#mapwrap { flex:1; position:relative; }
#map { width:100%; height:100%; background:#dde8f0; }

/* 지역 라벨 */
.rlabel { background:rgba(255,255,255,.93); border:2px solid #1e3a5f; border-radius:9px; padding:5px 9px; box-shadow:0 2px 6px rgba(0,0,0,.25); cursor:pointer; white-space:nowrap; text-align:center; }
.rlabel .nm { font-weight:800; font-size:13px; color:#1e3a5f; }
.rlabel .st { display:flex; gap:4px; margin-top:3px; justify-content:center; }
.rlabel .st span { font-size:11px; font-weight:700; padding:1px 6px; border-radius:8px; color:#fff; }

/* 학교 마커: 왼쪽=점검, 오른쪽=소독 */
.smk { width:20px; height:20px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.45); overflow:hidden; display:flex; }
.smk i { display:block; width:50%; height:100%; }
.smk.all { border-color:#15803d; box-shadow:0 0 0 2.5px #22c55e, 0 1px 4px rgba(0,0,0,.45); }
/* 학교 이름 라벨 */
.slabel { background:rgba(255,255,255,.88); border:1px solid #b6c2d2; border-radius:5px; padding:1px 5px; font-size:11px; font-weight:700; color:#1e293b; box-shadow:0 1px 3px rgba(0,0,0,.2); white-space:nowrap; }
.slabel::before { display:none; }
.hide-names .slabel { display:none; }

#backBtn { position:absolute; top:12px; left:12px; z-index:1000; background:#1e3a5f; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.3); display:none; }
#legend { position:absolute; bottom:14px; left:14px; z-index:1000; background:rgba(255,255,255,.95); border-radius:8px; padding:9px 13px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
#legend .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
#legend .half { width:16px; height:16px; border-radius:50%; border:1.5px solid #94a3b8; overflow:hidden; display:flex; }
#legend .half i { width:50%; height:100%; display:block; }
#savedmsg { position:absolute; top:12px; right:12px; z-index:1000; background:#22c55e; color:#fff; padding:7px 13px; border-radius:8px; font-size:13px; display:none; }

/* 지역 선택 시 우측 목록 (동선 계획용) */
#panel { position:absolute; top:0; right:0; bottom:0; width:270px; background:rgba(255,255,255,.97); z-index:1000; box-shadow:-2px 0 10px rgba(0,0,0,.2); display:none; flex-direction:column; }
#panel header { background:#1e3a5f; color:#fff; padding:11px 14px; font-size:15px; font-weight:800; display:flex; justify-content:space-between; align-items:center; }
#panel header button { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
#psummary { padding:9px 14px; border-bottom:1px solid #e2e8f0; font-size:12.5px; color:#334155; background:#f8fafc; line-height:1.7; }
#plist { flex:1; overflow-y:auto; }
.prow { padding:8px 14px; border-bottom:1px solid #f1f5f9; cursor:pointer; display:flex; align-items:center; gap:8px; }
.prow:hover { background:#eff6ff; }
.prow .nm2 { flex:1; font-size:13px; color:#1e293b; }
.prow .nm2 small { color:#94a3b8; display:block; font-size:11px; }
.tag { font-size:11px; font-weight:800; padding:2px 7px; border-radius:8px; color:#fff; }

.pp h3 { font-size:15px; color:#1e3a5f; margin-bottom:4px; }
.pp .meta { font-size:12px; color:#475569; line-height:1.55; }

.pp .btns button.on.d { background:#0d9488; border-color:#0d9488; color:#fff; }
</style>

function hull(points){ /* convex hull (fallback) */
  const pts=points.map(p=>[p[1],p[0]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(pts.length<3) return pts.map(p=>[p[1],p[0]]);
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop(); lo.push(p);}
  for(const p of pts.slice().reverse()){ while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop(); up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1)).map(p=>[p[1],p[0]]);
}
function expand(latlngs,f){ /* 외곽선 살짝 확장 */
  const cy=latlngs.reduce((a,p)=>a+p[0],0)/latlngs.length, cx=latlngs.reduce((a,p)=>a+p[1],0)/latlngs.length;
  return latlngs.map(p=>[cy+(p[0]-cy)*f, cx+(p[1]-cx)*f]);
}
function ringFromPoints(pts){ /* 현장 위치 기반 구역 외곽선 */
  if(pts.length>=3) return expand(hull(pts),1.3);
  const cy=pts.reduce((a,p)=>a+p[0],0)/pts.length, cx=pts.reduce((a,p)=>a+p[1],0)/pts.length;
  let rad=0.035;
  pts.forEach(p=>{ rad=Math.max(rad, Math.hypot(p[0]-cy,p[1]-cx)*1.6); });
  const ring=[], k=1/Math.cos(cy*Math.PI/180);
  for(let a=0;a<360;a+=15) ring.push([cy+rad*Math.sin(a*Math.PI/180), cx+rad*k*Math.cos(a*Math.PI/180)]);
  return ring;
}
function addPointRegion(r){ /* 현장 위치 기반 구역 (경기=율면 경계 우선) */
  if(r==='경기' && YUL){
    const g=YUL.geometry;
    (g.type==='MultiPolygon'?g.coordinates:[g.coordinates]).forEach(c=>
      managedRings.push(c[0].map(p=>[p[1],p[0]])));
    const poly=L.geoJSON(YUL,{style:shapeStyle(r)}).addTo(boundaryLayer);
    poly.on('click',()=>enterRegion(r));
    regionShapes[r]=[poly];
    return;
  }
  const ring=ringFromPoints(REGIONS[r].map(s=>[s.lat,s.lng]));
  managedRings.push(ring);
  const poly=L.polygon(ring,shapeStyle(r)).addTo(boundaryLayer);
  poly.on('click',()=>enterRegion(r));
  regionShapes[r]=[poly];
}
function buildFallback(){
  Object.keys(REGIONS).forEach(r=>{ regionShapes[r]=[]; addPointRegion(r); });
  finishBoundaries();
}
function buildFromGeo(gj){
  const used=new Set();
  Object.keys(REGION_MUNI).forEach(r=>{
    regionShapes[r]=[];
    if(POINT_REGIONS.indexOf(r)<0) gj.features.forEach(f=>{
      const nm=f.properties.name||'';
      if(used.has(f.properties.code)) return;
      if(REGION_MUNI[r].some(t=>nm.indexOf(t)>=0)){
        used.add(f.properties.code);
        const g=f.geometry;
        (g.type==='MultiPolygon'?g.coordinates:[g.coordinates]).forEach(c=>
          managedRings.push(c[0].map(p=>[p[1],p[0]])));
        const poly=L.geoJSON(f,{style:shapeStyle(r)}).addTo(boundaryLayer);
        poly.on('click',()=>enterRegion(r));
        regionShapes[r].push(poly);
      }
    });
    if(!regionShapes[r].length && REGIONS[r]) addPointRegion(r);
  });
  finishBoundaries();
}
function shapeStyle(r){
  return {color:'#1e3a5f',weight:2.5,fillColor:'#eaf3ff',fillOpacity:.55,opacity:.95};
}
(async function(){
  /* 이천 율면 동네 경계 */
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent('이천시 율면')+'&format=geojson&polygon_geojson=1&limit=1');
    if(r.ok){
      const g=await r.json(), f=g.features&&g.features[0];
      if(f&&f.geometry&&/Polygon/.test(f.geometry.type)) YUL=f;
    }
  }catch(e){}
  for(const url of GEO_URLS){
    try{
      const res=await fetch(url);
      if(res.ok){ buildFromGeo(await res.json()); return; }
    }catch(e){}
  }
  buildFallback();
})();

/* 지역 라벨 */
const labelLayer=L.layerGroup().addTo(map);
const regionLabels={};
function buildLabels(){
  labelLayer.clearLayers();
  Object.keys(REGIONS).forEach(r=>{
    const lab=L.marker(regionCenter[r],{icon:L.divIcon({className:'',html:labelHTML(r),iconSize:null}),interactive:true});
    lab.on('click',()=>enterRegion(r));
    lab.addTo(labelLayer);
    regionLabels[r]=lab;
  });
}
function labelHTML(r){
  const a=REGIONS[r].filter(visible), mi=mIdx();
  const di=a.filter(s=>s.m[mi][0]).length, dd=a.filter(s=>s.m[mi][1]).length, t=a.length;
  const cI=di>=t&&t?C_I:(di?'#93b4f5':'#9aa6b5');
  const cD=dd>=t&&t?C_D:(dd?'#67c5bc':'#9aa6b5');
  return `<div class="rlabel"><div class="nm">${r} (${t})</div>
    <div class="st"><span style="background:${cI}">점검 ${di}/${t}</span><span style="background:${cD}">소독 ${dd}/${t}</span></div></div>`;
}

/* 학교 마커 */
const markerLayer=L.layerGroup();
const markers={};
function mkIcon(s){
  const mi=mIdx();
  const all=s.m[mi][0]&&s.m[mi][1];
  return L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],
    html:`<div class="smk${all?' all':''}"><i style="background:${s.m[mi][0]?C_I:C_NO}"></i><i style="background:${s.m[mi][1]?C_D:C_NO}"></i></div>`});
}
SCHOOLS.forEach(s=>{
  const m=L.marker([s.lat,s.lng],{icon:mkIcon(s)});
  m.bindPopup(()=>popupHTML(s),{maxWidth:290});
  /* 이름 라벨: 지역명과 겹치는 앞단어는 생략 (예: "천안 ○○초" → "○○초") */
  const short=s.name.indexOf(s.region+' ')===0?s.name.slice(s.region.length+1):s.name;
  m.bindTooltip(short,{permanent:true,direction:'right',offset:[11,0],className:'slabel'});
  markers[s.no]=m;
});
/* 너무 축소하면 이름 숨김 (겹침 방지) */
map.on('zoomend',()=>{
  document.getElementById('map').classList.toggle('hide-names',map.getZoom()<10);
});
function popupHTML(s){
  const mi=mIdx(), mo=monthSel.value;
  return `<div class="pp"><h3>${s.name}</h3>
    <div class="meta">${s.region} · ${s.manager}<br>${s.addr}<br>☎ ${s.tel}</div>
    ${s.note?`<div class="note">📌 ${s.note}</div>`:''}
    <div class="btns">
      <button class="i ${s.m[mi][0]?'on':''}" onclick="tog(${s.no},0)">${mo}월 점검 ${s.m[mi][0]?'완료 ✓':''}</button>
      <button class="d ${s.m[mi][1]?'on':''}" onclick="tog(${s.no},1)">${mo}월 소독 ${s.m[mi][1]?'완료 ✓':''}</button>
    </div></div>`;
}
function tog(no,k){
  const s=SCHOOLS.find(x=>x.no===no);
  s.m[mIdx()][k]=s.m[mIdx()][k]?0:1;
  save();
  markers[no].setPopupContent(popupHTML(s)).setIcon(mkIcon(s));
  refresh(false);
}

/* 지역 진입 / 전체 보기 */
function enterRegion(r){
  selRegion=r;
  const pts=REGIONS[r].map(s=>[s.lat,s.lng]);
  map.fitBounds(L.latLngBounds(pts).pad(0.18));
  if(!map.hasLayer(markerLayer)) markerLayer.addTo(map);
  document.getElementById('backBtn').style.display='block';
  document.getElementById('panel').style.display='flex';
  refresh(false);
}
function goOverview(){
  selRegion=null;
  map.removeLayer(markerLayer);
  map.fitBounds(HOME);
  document.getElementById('backBtn').style.display='none';
  document.getElementById('panel').style.display='none';
  refresh(false);
}

/* 화면 갱신 */
function refresh(){
  const mi=mIdx();
  /* 라벨 */
  Object.keys(regionLabels).forEach(r=>regionLabels[r].setIcon(L.divIcon({className:'',html:labelHTML(r),iconSize:null})));
  /* 폴리곤 강조 */
  Object.keys(regionShapes).forEach(r=>{
    regionShapes[r].forEach(p=>p.setStyle({
      opacity:selRegion&&selRegion!==r?.4:.95,
      fillOpacity:selRegion?(selRegion===r?.05:.45):.45
    }));
  });
  /* 마커 */
  markerLayer.clearLayers();
  if(selRegion){
    REGIONS[selRegion].filter(visible).forEach(s=>{
      markers[s.no].setIcon(mkIcon(s));
      markers[s.no].addTo(markerLayer);
    });
  }
  /* 상단 합계 */
  const list=SCHOOLS.filter(visible);
  const di=list.filter(s=>s.m[mi][0]).length, dd=list.filter(s=>s.m[mi][1]).length;
  document.getElementById('totals').innerHTML=
    `<span class="chip i">점검 ${di} / ${list.length}</span><span class="chip d">소독 ${dd} / ${list.length}</span>`;
  /* 범례 */
  document.getElementById('legend').innerHTML=
    `<div class="row"><span class="half"><i style="background:${C_I}"></i><i style="background:${C_D}"></i></span> 왼쪽=점검 · 오른쪽=소독</div>
     <div class="row"><span class="half"><i style="background:${C_I}"></i><i style="background:${C_NO}"></i></span> 점검만 완료</div>
     <div class="row"><span class="half"><i style="background:${C_NO}"></i><i style="background:${C_NO}"></i></span> 둘 다 미완료</div>
     <div class="row"><span class="half" style="border:2px solid #15803d;box-shadow:0 0 0 2px #22c55e"><i style="background:${C_I}"></i><i style="background:${C_D}"></i></span> <b>모두 완료 (초록 테두리)</b></div>`;
  /* 우측 목록 (미완료 우선 → 동선 계획용) */
  if(selRegion){
    const a=REGIONS[selRegion].filter(visible);
    const ddone=a.filter(s=>s.m[mi][0]&&s.m[mi][1]).length;
    document.getElementById('ptitle').textContent=selRegion+' · '+a.length+'개소';
    document.getElementById('psummary').innerHTML=
      `${monthSel.value}월 점검 <b style="color:${C_I}">${a.filter(s=>s.m[mi][0]).length}</b> · 소독 <b style="color:${C_D}">${a.filter(s=>s.m[mi][1]).length}</b> · 모두 완료 ${ddone}<br>아래 목록: <b>미완료 현장이 위쪽</b>`;
    const sorted=a.slice().sort((x,y)=>(x.m[mi][0]+x.m[mi][1])-(y.m[mi][0]+y.m[mi][1])||x.name.localeCompare(y.name));
    document.getElementById('plist').innerHTML=sorted.map(s=>{
      const ti=s.m[mi][0],td=s.m[mi][1];
      return `<div class="prow" onclick="focusSchool(${s.no})">
        <div class="nm2">${s.name}${s.note?' 📌':''}<small>${s.manager}</small></div>
        <span class="tag" style="background:${ti?C_I:'#cbd5e1'}">점검</span>
        <span class="tag" style="background:${td?C_D:'#cbd5e1'}">소독</span></div>`;
    }).join('');
  }
}
function focusSchool(no){
  const s=SCHOOLS.find(x=>x.no===no);
  map.setView([s.lat,s.lng],14);
  markers[no].openPopup();
}

/* 내보내기/가져오기 */
function exportJSON(){
  const data=SCHOOLS.map(s=>({no:s.no,name:s.name,region:s.region,m:s.m}));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download='2026_점검소독현황_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      JSON.parse(e.target.result).forEach(v=>{
        const s=SCHOOLS.find(x=>x.no===v.no);
        if(s&&v.m) s.m=v.m;
      });
      save(); refresh(); alert('가져오기 완료');
    }catch(err){ alert('파일 형식이 올바르지 않습니다'); }
  };
  r.readAsText(f); inp.value='';
}
function resetMonth(){
  if(!confirm(monthSel.value+'월 기록을 모두 지울까요?'))return;
  SCHOOLS.forEach(s=>s.m[mIdx()]=[0,0]);
  save(); refresh();
}
function pip(p,ring){ /* 점이 다각형 안에 있는지 */
  let ins=false; const y=p[0],x=p[1];
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const yi=ring[i][0],xi=ring[i][1],yj=ring[j][0],xj=ring[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}
function finishBoundaries(){
  /* 다른 구역 안에 완전히 들어간 외곽선은 마스크에서 제외 (겹치면 그 부분이 다시 회색이 되는 문제 방지) */
  const maskRings=managedRings.filter((r,i)=>!managedRings.some((R,j)=>{
    if(i===j) return false;
    let inCnt=0,n=0;
    const step=Math.max(1,Math.floor(r.length/20));
    for(let k=0;k<r.length;k+=step){ n++; if(pip(r[k],R)) inCnt++; }
    return n>0 && inCnt/n>0.9;
  }));
  const outer=[[-85,-180],[-85,180],[85,180],[85,-180]];
  L.polygon([outer].concat(maskRings),
    {stroke:false,fillColor:'#aab6c2',fillOpacity:.82,interactive:false}).addTo(map);
  refresh();
}

buildLabels();
refresh();

/* ===== 일일업무일지 연동: 직원이 입력한 점검·소독 기록을 지도에 자동 표시 ===== */
const APPS_URL='https://script.google.com/macros/s/AKfycbzrITG1l2MkXIZwidtDntcKajVJ6fYc94Ejxmjs_16XazYd7pRC9trsbKdAdPV9drhrtQ/exec';
function __norm(x){ return String(x==null?'':x).replace(/\s+/g,'').toLowerCase(); }
/* 학교별 매칭키: 지역 접두어를 뗀 짧은 이름 (예: "공주 경천초" → "경천초") */
SCHOOLS.forEach(s=>{ s._short=__norm(s.name.indexOf(s.region+' ')===0?s.name.slice(s.region.length+1):s.name); });
function __recalcAll(){ SCHOOLS.forEach(s=>{ let i=0,d=0; for(let k=0;k<12;k++){ if(s.m[k][0])i=1; if(s.m[k][1])d=1; } s.m[12]=[i,d]; }); }
function __findSchool(region,site){
  const sn=__norm(site); if(!sn) return null;
  let pool=SCHOOLS.filter(s=>s.region===region);
  if(!pool.length) pool=SCHOOLS;
  return pool.find(s=>s._short===sn)
      || pool.find(s=>s._short && (sn.indexOf(s._short)===0 || s._short.indexOf(sn)===0))
      || pool.find(s=>__norm(s.name)===sn || __norm(s.name).indexOf(sn)>=0);
}
window.__mapStat=function(res){
  try{
    const items=(res&&res.items)||[];
    items.forEach(it=>{
      const s=__findSchool(it.r||'', it.s||''); if(!s) return;
      (it.i||[]).forEach(m=>{ if(m>=0&&m<12) s.m[m][0]=1; });
      (it.d||[]).forEach(m=>{ if(m>=0&&m<12) s.m[m][1]=1; });
    });
    __recalcAll();
    Object.keys(markers).forEach(no=>{ const s=SCHOOLS.find(x=>String(x.no)===String(no)); if(s) markers[no].setIcon(mkIcon(s)); });
    buildLabels(); refresh();
  }catch(e){}
};
function loadFromIlji(){
  __recalcAll();
  const s=document.createElement('script');
  s.src=APPS_URL+'?action=mapstat&callback=__mapStat&t='+Date.now();
  s.onload=function(){s.remove();}; s.onerror=function(){s.remove();};
  document.body.appendChild(s);
}
__recalcAll();
loadFromIlji();
</script>
